name: Release

# A pushed v* tag is a release decision, and it is the maintainer's. This workflow verifies the tagged
# commit, publishes the packages to npm with provenance, and creates the GitHub release. Nothing here
# runs on a branch push or a pull request. npm publishing uses trusted publishing (OIDC): each of the
# four packages is configured on npmjs.com to trust this repository's release.yml, so there is no
# token or one-time password anywhere, and the provenance statement comes with it.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Publish to npm and create the GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Git identity for the workspace tests
        run: |
          git config --global user.email "ci@localhost"
          git config --global user.name "CI"
          git config --global init.defaultBranch main

      - name: The tag must have a changelog section and match the package version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no section for $VERSION. Release from a merged release pull request."
            exit 1
          fi
          for dir in packages/*; do
            PKG_VERSION="$(node -p "require('./$dir/package.json').version")"
            if [ "$PKG_VERSION" != "$VERSION" ]; then
              echo "$dir is at $PKG_VERSION, the tag is $VERSION."
              exit 1
            fi
          done

      - name: Full verification gate
        run: |
          node scripts/check-workflow.mjs
          pnpm qa
          pnpm build
          pnpm smoke
          pnpm audit --audit-level low

      # Trusted publishing needs npm 11.5.1 or newer; the npm bundled with Node 22 is older.
      - name: Upgrade npm
        run: npm install -g npm@latest

      # pnpm pack rewrites the workspace: ranges to real versions; npm publish then authenticates with
      # the OIDC identity of this job. A version with a hyphen (0.2.0-alpha.1) is a prerelease and goes
      # to the next tag, so it never becomes what a plain install resolves.
      - name: Pack and publish to npm
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DIST_TAG=latest
          case "$VERSION" in *-*) DIST_TAG=next ;; esac
          mkdir "$RUNNER_TEMP/tarballs"
          for dir in core engine runners cli; do
            (cd "packages/$dir" && pnpm pack --pack-destination "$RUNNER_TEMP/tarballs")
          done
          for name in indaba-core indaba-engine indaba-runners indaba; do
            npm publish "$RUNNER_TEMP/tarballs/$name-$VERSION.tgz" --tag "$DIST_TAG" --access public
          done

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {found=1; next} found && /^## \[/ {exit} found {print}' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
