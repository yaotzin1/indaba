version: "1.0"
name: "crud-inventory"

# Builds inventory-app (a CRUD API for a shop's stock, with one page) from an empty repository, with agents doing
# every stage: project rules (AGENTS.md and a spec-kit constitution), a spec-kit specification argued over by two
# agents, a plan, tasks, a project skill, tests first, the code, and three gates (tests, a black-box acceptance test,
# mutation testing) before a final review debate. The walkthrough is docs/cookbook-crud.md.
#
# Before the run (docs/cookbook-crud.md, step 1): a git repository with one commit that holds spec-kit
# (specify init --here --integration claude --script py), a .gitignore with .indaba/, node_modules/, reports/ and
# .stryker-tmp/, and acceptance/inventory.mjs copied from examples/crud-inventory/acceptance.mjs.
#   indaba validate crud-inventory.workflow.ai.yml && indaba plan crud-inventory.workflow.ai.yml
#   indaba run crud-inventory.workflow.ai.yml
#   git merge indaba/inventory-app        # the checkpoint steps commit each stage to this branch
#
# Agents follow spec-kit's skills (.claude/skills/speckit-*/SKILL.md) but run no commands: Indaba runs every command
# in the shell steps, so the agent steps keep the edit level and work the same on every OS.
#
# Checkpoints: every step runs in the same git worktree, and the scope guard that holds a step's permissions looks at
# everything changed since the worktree's last commit. A checkpoint commits before the next step that may write
# somewhere else, so each step is judged on its own changes.

roles:
  architect:
    runner: ["acp", "claude-code"]   # ACP first; the claude-code CLI only when ACP cannot start
    agent: "claude"
  reviewer:
    runner: ["acp", "claude-code"]
    agent: "claude"
  tester:
    runner: ["acp", "claude-code"]
    agent: "claude"
  implementer:
    runner: ["acp", "claude-code"]
    agent: "claude"

steps:
  # ---- 1. Project rules: the constitution, AGENTS.md and CLAUDE.md ------------------------------------------------
  - id: "foundation"
    role: "architect"
    isolation: "git_worktree"
    permissions: { level: edit, fs: { write: [".specify/memory/**", "AGENTS.md", "CLAUDE.md"] } }
    goal: >-
      This repository will hold "inventory-app", the stock list of a small shop: a JSON API and one HTML page.
      Read .claude/skills/speckit-constitution/SKILL.md and follow it to write .specify/memory/constitution.md with these
      principles: spec first (every change starts as a spec-kit feature in specs/); tests first, asserting exact status
      codes and bodies; mutation-tested (npm run mutation, Stryker, must reach a score of 80, and a surviving mutant is
      fixed with a test, never by lowering the threshold); no runtime npm dependencies (Node 22 standard library only,
      @stryker-mutator/core is the one development dependency); small and explicit (no branch the spec does not ask
      for). Quality gates: npm test, npm run mutation and node acceptance/inventory.mjs. Where the skill says to run a
      script, do not: read .specify/templates/constitution-template.md instead.
      Then write AGENTS.md, the rules every coding agent reads: what the project is, the layout (src/validate.js pure
      validation, src/store.js the store, src/app.js createApp({ store }) with the routes, src/server.js starts it on
      PORT, public/index.html, test/, acceptance/ which no one may edit, specs/), the commands (npm install, npm test,
      npm run mutation, node acceptance/inventory.mjs, npm start), the rules, a "Skills" section listing
      .claude/skills/speckit-* and what "done" means. Write CLAUDE.md as the single line @AGENTS.md.
      End your reply with: BOARD result: <one sentence on the principles>
    outputs: ["AGENTS.md", ".specify/memory/constitution.md"]
    board:
      post: [result]

  - id: "checkpoint_foundation"
    depends_on: ["foundation"]
    runner: "shell"
    commands:
      - "git add -A"
      - "git commit -q --allow-empty -m \"inventory-app: constitution and AGENTS.md\""
      - "git branch -f indaba/inventory-app HEAD"

  # ---- 2. The spec-kit specification, argued over, clarified, planned and broken into tasks ----------------------
  - id: "specify"
    isolation: "git_worktree"
    depends_on: ["checkpoint_foundation"]
    role: "architect"
    permissions: { level: edit, fs: { write: ["specs/**", ".specify/feature.json"] } }
    goal: >-
      Read .claude/skills/speckit-specify/SKILL.md and follow it with the feature description below. Use the short name
      inventory-app, so the feature directory is specs/001-inventory-app; create it and its files directly, and write
      .specify/feature.json. Do not run commands.
      Feature description: a shop owner keeps the stock list. An item has an id, an sku (1 to 32 characters of A-Z, 0-9
      and -, unique across items), a name (1 to 200 characters, not blank), a quantity and a priceCents (whole numbers of
      0 or more), createdAt and updatedAt (ISO 8601). The owner lists, adds, reads, changes (any of sku, name, quantity,
      priceCents) and removes items, adjusts stock by a non-zero whole number without going below zero, and lists the
      items whose quantity is below a given number. Other programs use the HTTP API, so it is part of the requirements:
      GET /api/items (with ?lowStock=n: quantity below n; 400 when n is not a whole number of 0 or more), POST /api/items
      (201; all four fields required and nothing else; 400 invalid, 409 sku taken), GET /api/items/:id (200, 404),
      PATCH /api/items/:id (any of the four fields, at least one, nothing else; 200, 400, 404, 409; an item may keep its
      own sku), DELETE /api/items/:id (204, 404), POST /api/items/:id/adjust with { "delta": <non-zero integer> } (200,
      400, 404, 422 when quantity would go below 0), GET / serving one HTML page that lists, adds, adjusts and removes
      items. Bodies are JSON; every error is { "error": "<message>" }; any other method or path is 404 with that shape.
      End your reply with these lines, each starting at the first character:
      BOARD result: <one sentence summarising the feature>
      BOARD fact feature.dir: specs/001-inventory-app
    outputs: ["specs/001-inventory-app/spec.md"]
    board:
      post: [result, fact]

  # The review is read-only, so the guard must not see the spec that specify just wrote: commit it first.
  - id: "checkpoint_draft"
    depends_on: ["specify"]
    runner: "shell"
    commands:
      - "git add -A"
      - "git commit -q --allow-empty -m \"inventory-app: draft specification\""
      - "git branch -f indaba/inventory-app HEAD"

  - id: "spec_review"
    depends_on: ["checkpoint_draft"]
    role: "reviewer"
    consensus_with: ["architect"]
    decision_type: "consensus"
    arbiter: "human"
    isolation: "git_worktree"
    permissions: { level: read }
    goal: >-
      Review specs/001-inventory-app/spec.md for what a tester or a coder would trip over: missing status codes, unclear
      validation, edge cases (an sku changed to one that exists, an adjustment of 0, a body with extra fields), anything
      that contradicts .specify/memory/constitution.md. Do not modify any file and do not run commands. Keep your reply
      under 200 words. AGREEMENT: means you accept the other participant's findings as the review's result. CRITIQUE:
      means a finding is missing, wrong or badly worded, and you say which. In your first reply list your own findings
      (at most five) and begin with CRITIQUE:.

  - id: "clarify"
    isolation: "git_worktree"
    depends_on: ["spec_review"]
    role: "architect"
    permissions: { level: edit, fs: { write: ["specs/**", ".specify/feature.json"] } }
    goal: >-
      Read .claude/skills/speckit-clarify/SKILL.md and follow it for specs/001-inventory-app/spec.md, with one change:
      nobody is there to answer questions, so answer each one yourself from the review findings on the board and the
      feature description, and record every question and answer in the spec's Clarifications section as the skill
      describes. Resolve every [NEEDS CLARIFICATION] marker. Do not run commands.
    board:
      read:
        steps: ["specify", "spec_review"]
        kinds: [proposal, critique, agreement, result, fact, decision]

  - id: "plan"
    isolation: "git_worktree"
    depends_on: ["clarify"]
    role: "architect"
    permissions: { level: edit, fs: { write: ["specs/**", ".specify/feature.json"] } }
    goal: >-
      Read .claude/skills/speckit-plan/SKILL.md and follow it for specs/001-inventory-app. Do not run the setup script:
      copy .specify/templates/plan-template.md to specs/001-inventory-app/plan.md yourself. Technical context: JavaScript
      ES modules on Node 22, node:http, node:fs and node:crypto, no runtime dependency, tests with node:test, mutation
      testing with Stryker's command runner, storage in memory with an optional JSON file (DATA_FILE). Layout as in
      AGENTS.md. Write research.md, data-model.md, contracts/api.md (every request, body, status and error) and
      quickstart.md. Do not run commands.
    outputs: ["specs/001-inventory-app/plan.md", "specs/001-inventory-app/contracts/api.md"]

  - id: "tasks"
    isolation: "git_worktree"
    depends_on: ["plan"]
    role: "architect"
    permissions: { level: edit, fs: { write: ["specs/**", ".specify/feature.json"] } }
    goal: >-
      Read .claude/skills/speckit-tasks/SKILL.md and follow it for specs/001-inventory-app. Do not run the setup script:
      use .specify/templates/tasks-template.md. Order the test tasks before the code tasks (the constitution makes tests
      first non-negotiable), and end with a task for the gates: npm test, npm run mutation, node acceptance/inventory.mjs.
      Do not run commands.
    outputs: ["specs/001-inventory-app/tasks.md"]

  - id: "checkpoint_spec"
    depends_on: ["tasks"]
    runner: "shell"
    commands:
      - "git add -A"
      - "git commit -q --allow-empty -m \"inventory-app: spec, plan and tasks\""
      - "git branch -f indaba/inventory-app HEAD"

  - id: "analyze"
    isolation: "git_worktree"
    depends_on: ["checkpoint_spec"]
    role: "reviewer"
    permissions: { level: read }
    goal: >-
      Read .claude/skills/speckit-analyze/SKILL.md and follow it for specs/001-inventory-app: check spec.md, plan.md,
      tasks.md and the constitution against each other. Do not modify any file and do not run commands. Post each
      CRITICAL or HIGH finding as one board line, starting at the first character:
      BOARD note: <severity> <finding and the file it is in>
      and end with: BOARD result: <how many findings of each severity>
    board:
      post: [note, result]

  # ---- 3. A project skill the coding steps will use ---------------------------------------------------------------
  - id: "skill"
    isolation: "git_worktree"
    depends_on: ["analyze"]
    role: "architect"
    permissions: { level: edit, fs: { write: [".agents/skills/add-endpoint/**", "AGENTS.md"] } }
    goal: >-
      Write a project skill at .agents/skills/add-endpoint/SKILL.md (the next step copies it to
      .claude/skills/add-endpoint/, because an agent cannot write under .claude/), with YAML front matter (name: add-endpoint and a
      one-line description saying when to use it), for adding or changing an API endpoint or a field in this app. It is
      the procedure the next steps follow, taken from AGENTS.md, the plan and contracts/api.md: contract first, failing
      tests first (which test file for what, exact statuses and bodies, every boundary), pure validation in
      src/validate.js, data rules in src/store.js, the route in src/app.js, then npm test and npm run mutation, killing
      each surviving mutant with a test; never edit acceptance/ or lower a threshold. Keep it under 60 lines. Add it to
      the Skills section of AGENTS.md by its final path, .claude/skills/add-endpoint/SKILL.md. Do not run commands.
    outputs: [".agents/skills/add-endpoint/SKILL.md"]

  - id: "checkpoint_skill"
    depends_on: ["skill"]
    runner: "shell"
    commands:
      - "node -e \"require('node:fs').cpSync('.agents/skills', '.claude/skills', { recursive: true })\""
      - "git add -A"
      - "git commit -q --allow-empty -m \"inventory-app: add-endpoint skill\""
      - "git branch -f indaba/inventory-app HEAD"

  # ---- 4. Tests first, then the code ------------------------------------------------------------------------------
  - id: "tests"
    isolation: "git_worktree"
    depends_on: ["checkpoint_skill"]
    role: "tester"
    permissions: { level: edit, fs: { write: ["test/**", "package.json", "stryker.config.json", "specs/001-inventory-app/tasks.md"] } }
    goal: >-
      Read AGENTS.md and follow .claude/skills/add-endpoint/SKILL.md for every endpoint in
      specs/001-inventory-app/contracts/api.md, doing only its test parts: write the tests, not the code.
      If package.json does not exist, write it as exactly
      { "name": "inventory-app", "type": "module", "private": true, "scripts": { "test": "node --test",
      "start": "node src/server.js", "mutation": "stryker run" }, "devDependencies": { "@stryker-mutator/core": "^10.1.1" } }
      and stryker.config.json as exactly
      { "testRunner": "command", "commandRunner": { "command": "npm test" }, "coverageAnalysis": "off",
      "mutate": ["src/**/*.js", "!src/server.js"], "reporters": ["clear-text", "json"],
      "clearTextReporter": { "allowColor": false }, "thresholds": { "high": 90, "low": 80, "break": 80 } }.
      Tests use node:test and node:assert/strict: unit tests of src/validate.js, store tests with an injected clock and
      id generator, and API tests that start createApp({ store }) from src/app.js on port 0 and call it with fetch.
      Also act on the analysis notes on the board. Tick the test tasks you completed in specs/001-inventory-app/tasks.md.
      Do not write anything under src/ or public/. Do not run commands.
      If this is a retry, the failure below is a mutation-testing report: each [Survived] mutant is a change to the code
      that no test noticed, and reports/mutation/mutation.json lists all of them. Add or sharpen tests until each would
      fail. Do not change stryker.config.json.
      End your reply with: BOARD result: <how many tests, and what they cover>
    board:
      read:
        steps: ["spec_review", "analyze"]
        kinds: [proposal, critique, agreement, result, fact, decision, note, question]
      post: [result]

  - id: "checkpoint_tests"
    depends_on: ["tests"]
    runner: "shell"
    commands:
      - "git add -A"
      - "git commit -q --allow-empty -m \"inventory-app: tests\""
      - "git branch -f indaba/inventory-app HEAD"

  - id: "implement"
    isolation: "git_worktree"
    depends_on: ["checkpoint_tests"]
    role: "implementer"
    permissions: { level: edit, fs: { write: ["src/**", "public/**", "specs/001-inventory-app/tasks.md"] } }
    goal: >-
      Read AGENTS.md, then read .claude/skills/speckit-implement/SKILL.md and follow it for specs/001-inventory-app,
      with these changes: do not run the setup script or any command (Indaba runs the tests after this step); the test
      tasks are done, so implement the remaining tasks, following .claude/skills/add-endpoint/SKILL.md; .gitignore
      already exists, leave it alone. Write src/validate.js, src/store.js, src/app.js, src/server.js (PORT, default 3000;
      DATA_FILE optional) and public/index.html. Make every test in test/ pass without changing test/, package.json,
      stryker.config.json or acceptance/. Tick the tasks you complete in tasks.md. If a test contradicts the spec, follow
      the spec and post: BOARD question: <which test, and why>
      If src/ already exists, this is a rerun after the mutation gate sent the run back to the tests: keep the code that
      passes, and change only what the new or changed tests need.
    board:
      read:
        steps: ["spec_review", "analyze", "tests"]
        kinds: [proposal, critique, agreement, result, fact, decision, note, question]
      post: [note, question]

  - id: "checkpoint_code"
    depends_on: ["implement"]
    runner: "shell"
    commands:
      - "git add -A"
      - "git commit -q --allow-empty -m \"inventory-app: code\""
      - "git branch -f indaba/inventory-app HEAD"

  # ---- 5. The gates -----------------------------------------------------------------------------------------------
  - id: "verify"
    depends_on: ["checkpoint_code"]
    runner: "shell"
    commands:
      - "npm install --no-package-lock --no-audit --no-fund"
      - "npm test"
    on_failure:
      action: "retry_step"
      target: "implement"
      max_retries: 3

  - id: "acceptance"
    depends_on: ["verify"]
    runner: "shell"
    commands:
      - "node acceptance/inventory.mjs"
    on_failure:
      action: "retry_step"
      target: "implement"
      max_retries: 2

  - id: "mutation"
    depends_on: ["acceptance"]
    runner: "shell"
    commands:
      - "npx stryker run"
      - "node -e \"const r=require('./reports/mutation/mutation.json');const s=[];let n=0;for(const[f,v]of Object.entries(r.files))for(const m of v.mutants){n++;if(m.status==='Survived')s.push(f+':'+m.location.start.line+' '+m.mutatorName)}require('node:fs').writeFileSync('reports/mutation/survivors.txt',[n+' mutants, '+s.length+' survived',...s].join(String.fromCharCode(10))+String.fromCharCode(10))\""
    on_failure:
      action: "retry_step"
      target: "tests"
      max_retries: 2

  # ---- 6. The final review ----------------------------------------------------------------------------------------
  - id: "final_review"
    depends_on: ["mutation"]
    role: "reviewer"
    consensus_with: ["architect"]
    decision_type: "consensus"
    arbiter: "human"
    isolation: "git_worktree"
    permissions: { level: read }
    goal: >-
      Review src/, public/ and test/ against specs/001-inventory-app (spec, plan, contracts) and AGENTS.md: correctness,
      validation, error handling, the page, and anything the tests do not cover (reports/mutation/survivors.txt gives the
      mutant counts and lists each survivor as file:line and mutator; read it). Do not modify any file and do not run commands. Keep your reply under 200 words. AGREEMENT:
      means you accept the other participant's findings as the review's result (they may criticise the code). CRITIQUE:
      means a finding is missing, wrong or badly worded. In your first reply list your own findings (at most five, each
      with a file path) and begin with CRITIQUE:.
    board:
      read:
        steps: ["analyze", "tests", "implement"]
