<!doctype html>
<!--
  The Indaba reel: 15 seconds, 1920x1080, drawn on a canvas by render(t), a pure function of the time in seconds.
  site/reel/render.mjs films it frame by frame into docs/assets/indaba-reel.mp4. Nothing here reads the clock or
  Math.random(), so the same source always gives the same film.

  Acts: 0.0 ignite · 1.5 the council gathers · 4.0 the debate · 7.0 consensus · 8.4 the run (a gate fails, the
  retry carries only the last failure, the gate passes) · 12.2 the trace · 13.6 the mark.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Indaba reel</title>
<style>
  html, body { margin: 0; background: #0c0805; }
  canvas { display: block; width: 1920px; height: 1080px; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ?short draws the vertical cut (1080x1920) for YouTube Shorts; the default is the landscape film of the site.
const SHORT = new URLSearchParams(location.search).has('short');
const W = SHORT ? 1080 : 1920, H = SHORT ? 1920 : 1080, FPS = 30, DURATION = 15;
const BIG = Math.max(W, H);
const cv = document.getElementById('c');
cv.width = W; cv.height = H; cv.style.width = `${W}px`; cv.style.height = `${H}px`;
const ctx = cv.getContext('2d');
const scratch = document.createElement('canvas');
scratch.width = W; scratch.height = H;
const sctx = scratch.getContext('2d');

// Colours from site/site.css (dark theme) and the brand mark.
const C = {
  bg0: '#24180f', bg1: '#0b0704', ink: '#f0e6d6', muted: '#b4a38e', line: '#3a2d23', lineStrong: '#5a4636',
  ochre: '#eab36a', ochreDeep: '#c2732b', ochreSoft: '#4a3520', ember: '#ff9a4d', sage: '#7cc9a0',
  sageSoft: '#1d3a2a', fail: '#ff8f82', failSoft: '#42201c', sheet: '#1b140f',
};
const SANS = "'Next', system-ui, sans-serif";
const MONO = "'Mono', ui-monospace, monospace";

// ---------- maths ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const TAU = Math.PI * 2;
const E = {
  outExpo: (k) => (k >= 1 ? 1 : 1 - Math.pow(2, -10 * k)),
  inExpo: (k) => (k <= 0 ? 0 : Math.pow(2, 10 * k - 10)),
  inOutExpo: (k) => k <= 0 ? 0 : k >= 1 ? 1 : k < 0.5 ? Math.pow(2, 20 * k - 10) / 2 : (2 - Math.pow(2, -20 * k + 10)) / 2,
  outCubic: (k) => 1 - Math.pow(1 - k, 3),
  inCubic: (k) => k * k * k,
  inOutCubic: (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2),
  outBack: (k) => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); },
  outElastic: (k) => k <= 0 ? 0 : k >= 1 ? 1 : Math.pow(2, -10 * k) * Math.sin((k * 10 - 0.75) * (TAU / 3)) + 1,
  outQuint: (k) => 1 - Math.pow(1 - k, 5),
};
function rng(seed) {
  return () => {
    seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
    let r = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  };
}
const hex = (h) => h[0] === '#' ? [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)] : h.match(/\d+/g).slice(0, 3).map(Number);
const mix = (a, b, k) => { const x = hex(a), y = hex(b); return `rgb(${x.map((v, i) => Math.round(lerp(v, y[i], k))).join(',')})`; };
const rgba = (h, a) => { const x = hex(h); return `rgba(${x[0]},${x[1]},${x[2]},${a})`; };
const quad = (p0, p1, p2, u) => ({
  x: (1 - u) * (1 - u) * p0.x + 2 * (1 - u) * u * p1.x + u * u * p2.x,
  y: (1 - u) * (1 - u) * p0.y + 2 * (1 - u) * u * p1.y + u * u * p2.y,
});

// ---------- prebuilt assets ----------
const FLAME = new Path2D('M400 316 C366 316 356 288 372 268 C374 282 384 284 386 276 C380 252 396 238 404 220 C410 242 432 256 430 282 C440 276 440 266 438 258 C456 280 440 316 400 316 Z');
const FLAME_IN = new Path2D('M400 314 C384 314 380 298 390 288 C392 296 398 296 399 290 C397 280 404 274 408 266 C412 278 420 284 418 296 C422 300 418 314 400 314 Z');
const grains = [];
{
  const r = rng(7);
  for (let g = 0; g < 4; g++) {
    const n = document.createElement('canvas'); n.width = 384; n.height = 384;
    const nc = n.getContext('2d'); const img = nc.createImageData(384, 384);
    for (let i = 0; i < img.data.length; i += 4) {
      const v = Math.floor(r() * 255);
      img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255;
    }
    nc.putImageData(img, 0, 0); grains.push(n);
  }
}
const EMBERS = (() => { const r = rng(42); return Array.from({ length: 90 }, () => ({ x: r() * W, s: 40 + r() * 120, p: r(), f: 0.5 + r() * 1.5, ph: r() * TAU, z: 0.4 + r() * 1.4 })); })();

// ---------- drawing helpers ----------
function text(str, x, y, { size = 32, weight = 400, font = SANS, color = C.ink, align = 'left', base = 'alphabetic', alpha = 1, spacing = 0 } = {}) {
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.font = `${weight} ${size}px ${font}`;
  ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = base;
  if (spacing) ctx.letterSpacing = `${spacing}px`;
  ctx.fillText(str, x, y);
  ctx.restore();
}
// A line of type that rises out of a mask, word by word.
function riseLine(words, x, y, size, t0, t, { weight = 800, gap = 0.07, dur = 0.55, out = 1e9, outDur = 0.35, center = false } = {}) {
  ctx.save();
  ctx.font = `${weight} ${size}px ${SANS}`;
  let cx = x;
  if (center) cx = x - (words.reduce((a, [w]) => a + ctx.measureText(w).width, 0) + size * 0.26 * (words.length - 1)) / 2;
  words.forEach(([w, color], i) => {
    const k = E.outExpo(seg(t, t0 + i * gap, t0 + i * gap + dur));
    const ko = E.inCubic(seg(t, out + i * gap * 0.5, out + i * gap * 0.5 + outDur));
    const wd = ctx.measureText(w).width;
    ctx.save();
    ctx.beginPath(); ctx.rect(cx - 10, y - size * 1.05, wd + 20, size * 1.38); ctx.clip();
    ctx.fillStyle = color;
    ctx.fillText(w, cx, y + (1 - k) * size * 1.2 - ko * size * 1.25);
    ctx.restore();
    cx += wd + size * 0.26;
  });
  ctx.restore();
}
function typeOn(str, x, y, t0, t, cps, opts) {
  const n = Math.floor(clamp((t - t0) * cps, 0, str.length));
  if (n <= 0) return;
  const caret = n < str.length || Math.floor(t * 2.5) % 2 === 0 ? '▍' : '';
  text(str.slice(0, n) + (t - t0 < str.length / cps + 0.9 ? caret : ''), x, y, opts);
}
function glow(x, y, r, color, a) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, rgba(color, a)); g.addColorStop(1, rgba(color, 0));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
}
function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2))); }

function fire(x, y, s, t, intensity = 1) {
  if (s <= 0.001) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  glow(x, y - 20 * s, 210 * s * intensity, '#ff8a2a', 0.42 * clamp(intensity, 0, 1.4));
  glow(x, y - 30 * s, 90 * s * intensity, '#ffc46b', 0.35 * clamp(intensity, 0, 1.4));
  ctx.restore();
  const fl = 1 + 0.07 * Math.sin(t * 13.1) + 0.04 * Math.sin(t * 23.7 + 1.3);
  const sk = 0.06 * Math.sin(t * 7.3) + 0.03 * Math.sin(t * 17.9);
  ctx.save();
  ctx.translate(x, y + 26 * s);
  ctx.scale(s * 1.05, s * fl);
  ctx.transform(1, 0, sk, 1, 0, 0);
  ctx.translate(-400, -316);
  const g = ctx.createLinearGradient(0, 316, 0, 220);
  g.addColorStop(0, '#d9480f'); g.addColorStop(0.6, '#ffa94d'); g.addColorStop(1, '#ffe066');
  ctx.fillStyle = g; ctx.fill(FLAME);
  ctx.globalAlpha = 0.92; ctx.fillStyle = '#fff3bf'; ctx.fill(FLAME_IN);
  ctx.restore();
}
function person(x, y, s, fill) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = fill;
  ctx.beginPath(); ctx.arc(0, -11, 9.5, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-15, 19); ctx.quadraticCurveTo(-15, 1, 0, 1); ctx.quadraticCurveTo(15, 1, 15, 19); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function ochreFill(x, y, r) {
  const g = ctx.createLinearGradient(x - r, y - r, x + r, y + r);
  g.addColorStop(0, '#f1c27a'); g.addColorStop(1, '#c2732b'); return g;
}

// ---------- the council (world space, centre 960,540) ----------
const CX = W / 2, CY = SHORT ? 1080 : 540, R = SHORT ? 290 : 250;
const ROLES = ['architect', 'coder', 'reviewer', 'tester', 'security', 'scribe'];
const MSGS = [[0, 3], [3, 0], [1, 4], [2, 5], [4, 1], [5, 2], [0, 2], [3, 5], [1, 3], [4, 0], [2, 4], [5, 1], [0, 4], [3, 1], [2, 0], [5, 3]];
const WORDS = ['objection', 'evidence?', 'counter', 'cite the line', 'edge case', 'not yet', 'show the diff', 're-check', 'fair point', 'conceded', '+1', 'agreed', 'agreed', 'agreed', 'agreed', 'agreed'];
const MSG_T0 = 4.15, MSG_STEP = 0.165, MSG_DUR = 0.5;
const ringRot = (t) => 0.32 * E.inOutCubic(seg(t, 3.6, 7.6));
function agentAppear(i, t) { return E.outBack(seg(t, 1.55 + i * 0.09, 2.2 + i * 0.09)); }
function agentPos(i, t) {
  const a = -Math.PI / 2 + i * (TAU / 6) + ringRot(t);
  const r = R * agentAppear(i, t) + 4 * Math.sin(t * 2.1 + i);
  return { x: CX + Math.cos(a) * r, y: CY + Math.sin(a) * r, a };
}
const CONSENSUS = 7.05, FLASH = 7.38;

function drawCouncil(t) {
  const fade = 1 - seg(t, 7.95, 8.3);
  if (fade <= 0) return;
  ctx.save(); ctx.globalAlpha = fade;
  const sage = E.inOutCubic(seg(t, FLASH - 0.05, FLASH + 0.35));

  // Shockwaves from the spark landing, and from consensus.
  for (const [t0, col, n] of [[0.62, C.ochre, 2], [FLASH, C.sage, 3]]) {
    for (let j = 0; j < n; j++) {
      const k = seg(t, t0 + j * 0.09, t0 + j * 0.09 + 1.1);
      if (k <= 0 || k >= 1) continue;
      ctx.strokeStyle = rgba(col, (1 - k) * 0.7); ctx.lineWidth = 3 * (1 - k) + 0.5;
      ctx.beginPath(); ctx.arc(CX, CY, 20 + E.outExpo(k) * (700 + j * 160), 0, TAU); ctx.stroke();
    }
  }

  // Rings drawing on.
  const ringK = E.inOutCubic(seg(t, 0.7, 1.6));
  const ringCol = mix(C.ochreDeep, C.sage, sage);
  ctx.lineWidth = 2; ctx.strokeStyle = rgba('#c2732b', 0.55);
  ctx.strokeStyle = ringCol; ctx.globalAlpha = fade * 0.65;
  ctx.beginPath(); ctx.arc(CX, CY, R, -Math.PI / 2, -Math.PI / 2 + TAU * ringK); ctx.stroke();
  ctx.globalAlpha = fade * 0.4;
  ctx.beginPath(); ctx.arc(CX, CY, R * 0.42, Math.PI / 2, Math.PI / 2 - TAU * ringK, true); ctx.stroke();
  ctx.globalAlpha = fade * 0.7 * ringK;
  ctx.setLineDash([2, 14]); ctx.lineCap = 'round'; ctx.lineWidth = 3;
  ctx.lineDashOffset = -t * 40;
  ctx.beginPath(); ctx.arc(CX, CY, R + 42, 0, TAU); ctx.stroke();
  ctx.setLineDash([]); ctx.lineDashOffset = 0;
  // Tick marks around the outer ring, a compass of the debate.
  for (let i = 0; i < 72; i++) {
    const k = seg(t, 0.9 + i * 0.008, 1.2 + i * 0.008);
    if (k <= 0) continue;
    const a = i * TAU / 72 - ringRot(t) * 0.5;
    const r0 = R + 64, r1 = r0 + (i % 6 === 0 ? 16 : 7);
    ctx.globalAlpha = fade * 0.45 * k; ctx.lineWidth = i % 6 === 0 ? 2 : 1;
    ctx.beginPath(); ctx.moveTo(CX + Math.cos(a) * r0, CY + Math.sin(a) * r0); ctx.lineTo(CX + Math.cos(a) * r1, CY + Math.sin(a) * r1); ctx.stroke();
  }
  ctx.globalAlpha = fade;

  // The mesh: a chord for every exchange that has landed.
  MSGS.forEach(([a, b], m) => {
    const end = MSG_T0 + m * MSG_STEP + MSG_DUR;
    const k = seg(t, end - 0.05, end + 0.3);
    if (k <= 0) return;
    const p = agentPos(a, t), q = agentPos(b, t);
    ctx.strokeStyle = mix(C.ochreDeep, C.sage, sage);
    ctx.globalAlpha = fade * k * lerp(0.22, 0.5, sage); ctx.lineWidth = lerp(1.2, 2, sage);
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();
  });
  ctx.globalAlpha = fade;

  // Consensus rays from every agent to the fire.
  for (let i = 0; i < 6; i++) {
    const k = E.outExpo(seg(t, CONSENSUS + i * 0.035, CONSENSUS + 0.32 + i * 0.035));
    if (k <= 0) continue;
    const p = agentPos(i, t);
    const ex = lerp(p.x, CX, k * 0.86), ey = lerp(p.y, CY, k * 0.86);
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = rgba(C.sage, 0.9 * (1 - seg(t, 7.7, 8.1))); ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.shadowColor = C.sage; ctx.shadowBlur = 24;
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.restore();
  }

  // Messages: comets between agents.
  MSGS.forEach(([a, b], m) => {
    const t0 = MSG_T0 + m * MSG_STEP, k = seg(t, t0, t0 + MSG_DUR);
    if (k <= 0 || k >= 1 + 0.4) return;
    const p = agentPos(a, t), q = agentPos(b, t);
    const mx = (p.x + q.x) / 2, my = (p.y + q.y) / 2;
    const dx = q.x - p.x, dy = q.y - p.y, len = Math.hypot(dx, dy) || 1;
    const bend = (m % 2 ? 1 : -1) * 0.22 * len;
    const ctl = { x: mx - (dy / len) * bend, y: my + (dx / len) * bend };
    const col = m % 3 === 0 ? C.ember : m >= 10 ? C.sage : C.ochre;
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
    const head = E.inOutCubic(k);
    for (let j = 0; j < 22; j++) {
      const u = head - j * 0.022;
      if (u < 0 || u > 1) continue;
      const u2 = Math.max(0, u - 0.022);
      const s0 = quad(p, ctl, q, u2), s1 = quad(p, ctl, q, u);
      ctx.strokeStyle = rgba(col, (1 - j / 22) * 0.85 * (1 - seg(k, 0.98, 1)));
      ctx.lineWidth = 7 * (1 - j / 22) + 0.5;
      ctx.beginPath(); ctx.moveTo(s0.x, s0.y); ctx.lineTo(s1.x, s1.y); ctx.stroke();
    }
    if (k < 1) { const h = quad(p, ctl, q, head); glow(h.x, h.y, 26, col, 0.9); ctx.fillStyle = '#fff6e0'; ctx.beginPath(); ctx.arc(h.x, h.y, 4, 0, TAU); ctx.fill(); }
    ctx.restore();
  });

  // Agents.
  for (let i = 0; i < 6; i++) {
    const ap = agentAppear(i, t);
    if (ap <= 0.001) continue;
    const p = agentPos(i, t);
    let pulse = 0;
    MSGS.forEach(([, b], m) => { if (b === i) { const e = MSG_T0 + m * MSG_STEP + MSG_DUR; pulse = Math.max(pulse, 1 - seg(t, e, e + 0.5) * (t >= e ? 1 : 0) - (t < e ? 1 : 0)); } });
    const flashK = 1 - seg(t, FLASH, FLASH + 0.8);
    const sageI = E.inOutCubic(seg(t, CONSENSUS + i * 0.035, CONSENSUS + 0.3 + i * 0.035));
    ctx.save();
    ctx.translate(p.x, p.y); ctx.scale(clamp(ap, 0, 1.4), clamp(ap, 0, 1.4));
    // pulse ring
    MSGS.forEach(([, b], m) => {
      if (b !== i) return;
      const e = MSG_T0 + m * MSG_STEP + MSG_DUR, k = seg(t, e, e + 0.55);
      if (k <= 0 || k >= 1) return;
      ctx.strokeStyle = rgba(m >= 10 ? C.sage : C.ember, 1 - k); ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(0, 0, 38 + E.outExpo(k) * 40, 0, TAU); ctx.stroke();
    });
    glow(0, 0, 70, sageI > 0 ? C.sage : C.ember, 0.18 + 0.25 * sageI * flashK);
    ctx.fillStyle = '#1d140e'; ctx.beginPath(); ctx.arc(0, 0, 38, 0, TAU); ctx.fill();
    ctx.strokeStyle = mix(C.ochre, C.sage, sageI); ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(0, 0, 38, 0, TAU); ctx.stroke();
    person(0, 2, 1.25, ochreFill(0, 0, 20));
    ctx.restore();
    // label, radially outwards
    const lk = E.outExpo(seg(t, 2.0 + i * 0.07, 2.6 + i * 0.07)) * (1 - seg(t, 4.05, 4.3));
    if (lk > 0) {
      const lx = CX + Math.cos(p.a) * (R + 120), ly = CY + Math.sin(p.a) * (R + 120) + 8;
      text(ROLES[i], lx, ly, { size: 22, font: MONO, color: mix(C.muted, C.sage, sageI), align: 'center', alpha: lk, spacing: 1 });
    }
  }

  // Word chips where messages land.
  MSGS.forEach(([, b], m) => {
    const e = MSG_T0 + m * MSG_STEP + MSG_DUR;
    const k = seg(t, e - 0.02, e + 0.28), ko = seg(t, e + 0.55, e + 0.8);
    if (k <= 0 || ko >= 1 || t > CONSENSUS + 0.25) return;
    const p = agentPos(b, t);
    const out = 96, side = (m % 2 ? 1 : -1) * 14;
    const x = p.x + Math.cos(p.a) * out - Math.sin(p.a) * side, y = p.y + Math.sin(p.a) * out + Math.cos(p.a) * side;
    const s = E.outBack(k) * (1 - E.inCubic(ko));
    const word = WORDS[m];
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    ctx.font = `700 21px ${MONO}`;
    const w = ctx.measureText(word).width + 30;
    const col = m >= 10 ? C.sage : m % 3 === 0 ? C.ember : C.ochre;
    roundRect(-w / 2, -20, w, 40, 20); ctx.fillStyle = 'rgba(24,17,12,0.94)'; ctx.fill();
    ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.stroke();
    text(word, 0, 1, { size: 21, weight: 700, font: MONO, color: col, align: 'center', base: 'middle' });
    ctx.restore();
  });

  // The fire at the centre.
  const fireS = E.outBack(seg(t, 0.58, 1.25)) * (1 + 0.55 * Math.exp(-Math.max(0, t - FLASH) * 4) * (t > FLASH ? 1 : 0));
  fire(CX, CY, fireS * 1.35, t, 1 + 0.6 * (t > FLASH ? Math.exp(-(t - FLASH) * 2.5) : 0));
  ctx.restore();

  // The spark that lights it.
  const sk = seg(t, 0.0, 0.62);
  if (sk > 0 && sk < 1) {
    const e = E.inCubic(sk);
    const y = lerp(1250, CY, e), x = CX + Math.sin(sk * 9) * 30 * (1 - sk);
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (let j = 0; j < 18; j++) {
      const u = Math.max(0, sk - j * 0.018), ee = E.inCubic(u);
      glow(CX + Math.sin(u * 9) * 30 * (1 - u), lerp(1250, CY, ee), 18 - j * 0.8, C.ember, 0.5 * (1 - j / 18));
    }
    glow(x, y, 60, '#ffc46b', 0.8);
    ctx.fillStyle = '#fff6e0'; ctx.beginPath(); ctx.arc(x, y, 5, 0, TAU); ctx.fill();
    ctx.restore();
  }
}

// ---------- the run (world space of its own) ----------
// Landscape: the graph runs left to right. Short: top to bottom, labels to the right of the nodes.
const RY = 540, RUN0 = 8.4;
const NODES = ['spec', 'plan', 'code', 'gate', 'review', 'done'].map((id, i) => ({
  id, gate: id === 'gate', x: SHORT ? 440 : 300 + i * 330, y: SHORT ? 400 + i * 236 : RY,
}));
const RUN_MID = SHORT ? { x: 440, y: (NODES[0].y + NODES[5].y) / 2 } : { x: 1125, y: RY };
const FAIL = 10.0, PASS = 11.25;
// The token's journey: [t0, t1, from, to] by node index, or the retry arc.
const LEGS = [[8.85, 9.2, 0, 1], [9.25, 9.6, 1, 2], [9.65, 10.0, 2, 3], [10.25, 10.85, 3, 2, 'arc'], [10.9, 11.25, 2, 3], [11.3, 11.65, 3, 4], [11.7, 12.05, 4, 5]];
const ARC_CTL = SHORT ? { x: 440 - 300, y: (NODES[2].y + NODES[3].y) / 2 } : { x: 1125, y: RY - 300 };
function tokenAt(t) {
  if (t < LEGS[0][0]) return { x: NODES[0].x, y: NODES[0].y, moving: false };
  for (const [a, b, f, to, arc] of LEGS) {
    if (t >= a && t <= b) {
      const u = E.inOutCubic(seg(t, a, b));
      const p = NODES[f], q = NODES[to];
      if (arc) return { ...quad(p, ARC_CTL, q, u), moving: true, arc: true, u };
      return { x: lerp(p.x, q.x, u), y: lerp(p.y, q.y, u), moving: true, u };
    }
  }

function camera(t) {
  let cx = CX, cy = CY, z = 1, rot = 0;
  if (t < RUN0) {
    z = lerp(1.45, 1.0, E.outExpo(seg(t, 0.55, 1.7)));
    const side = E.inOutCubic(seg(t, 1.75, 2.55)) * (1 - E.inOutCubic(seg(t, 3.9, 4.55)));
    if (SHORT) { cy = lerp(CY, 770, side); z = lerp(z, 0.9, side); } else { cx = lerp(CX, 560, side); z = lerp(z, 0.84, side); }
    z *= lerp(1, 1.13, E.inOutCubic(seg(t, 4.4, 7.2)));
    rot = 0.035 * Math.sin(seg(t, 4.4, 7.2) * Math.PI) ;
    const punch = t > FLASH ? Math.exp(-(t - FLASH) * 6) * Math.sin((t - FLASH) * 30) * 0.03 : 0;
    z *= 1 + punch + (t > FLASH ? 0.04 * E.outExpo(seg(t, FLASH, FLASH + 0.4)) : 0);
    // dive into the fire
    const dive = E.inExpo(seg(t, 7.72, RUN0));
    z *= Math.pow(30, dive); cy = lerp(CY, CY - 10, dive);
  } else {
    // pull out of the first node, follow the token, settle on the whole graph
    const pull = E.outExpo(seg(t, RUN0, RUN0 + 0.8));
    const follow = E.inOutCubic(seg(t, 9.0, 10.1));
    const tok = tokenAt(t);
    cx = lerp(tok.x, RUN_MID.x, follow);
    const cyRun = lerp(tok.y, RUN_MID.y, follow);
    z = lerp(6, lerp(SHORT ? 1.25 : 1.55, SHORT ? 0.88 : 0.94, follow), pull);
    z *= lerp(1, 1.04, seg(t, 10.1, MORPH0));
    cy = cyRun;
    if (t > FAIL && t < FAIL + 0.45) { const d = 1 - seg(t, FAIL, FAIL + 0.45); cx += Math.sin(t * 97) * 16 * d; cy += Math.cos(t * 83) * 11 * d; }
    // settle to identity for the trace
    const m = E.inOutCubic(seg(t, MORPH0, MORPH1));
    cx = lerp(cx, W / 2, m); cy = lerp(cy, H / 2, m); z = lerp(z, 1, m);
  }
  return { cx, cy, z, rot };
}

// ---------- frame ----------
function background(t) {
  const sageT = t > FLASH ? Math.exp(-(t - FLASH) * 2) * 0.35 : 0;
  const g = ctx.createRadialGradient(W / 2, H * 0.48, 0, W / 2, H * 0.48, BIG * 0.75);
  g.addColorStop(0, mix(C.bg0, '#1d3a2a', sageT)); g.addColorStop(1, C.bg1);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // faint dot grid, drifting
  ctx.save(); ctx.fillStyle = 'rgba(240,230,214,0.045)';
  const off = (t * 14) % 48;
  for (let y = -48; y < H + 48; y += 48) for (let x = -48; x < W + 48; x += 48) { ctx.beginPath(); ctx.arc(x + off, y + off * 0.4, 1.4, 0, TAU); ctx.fill(); }
  ctx.restore();
}
function embers(t) {
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const boost = 1 + (t > FLASH ? 2.5 * Math.exp(-(t - FLASH) * 1.5) : 0);
  for (const e of EMBERS) {
    const span = H + 120;
    const y = H + 60 - ((t * e.s * boost + e.p * span) % span);
    const x = e.x + Math.sin(t * e.f + e.ph) * 26;
    const tw = 0.5 + 0.5 * Math.sin(t * 5 * e.f + e.ph);
    glow(x, y, 7 * e.z, e.p > 0.8 ? C.sage : C.ember, 0.14 + 0.18 * tw);
  }
  ctx.restore();
}
function hud(t, f) {
  const act = t < 1.5 ? null : t < RUN0 ? '01 · the council' : t < MORPH0 ? '02 · the run' : t < COLLAPSE ? '03 · the trace' : null;
  const actT0 = t < RUN0 ? 1.6 : t < MORPH0 ? RUN0 + 0.3 : MORPH0 + 0.2;
  if (act) {
    ctx.save(); ctx.strokeStyle = rgba(C.ochre, 0.8); ctx.lineWidth = 2;
    const k = E.outExpo(seg(t, actT0, actT0 + 0.5));
    ctx.beginPath(); ctx.moveTo(72, 78); ctx.lineTo(72 + 40 * k, 78); ctx.stroke(); ctx.restore();
    typeOn(act, 126, 86, actT0, t, 40, { size: 22, font: MONO, color: C.ochre, spacing: 1 });
  }
  if (t > 4.0 && t < FLASH) {
    const ok = false;
    const label = ok ? 'consensus' : 'debating';
    const a = seg(t, 4.0, 4.3) * (1 - seg(t, 7.7, 7.95));
    const dot = ok ? C.sage : C.ember;
    ctx.save(); ctx.globalAlpha = a;
    ctx.font = `700 22px ${MONO}`; const w = ctx.measureText(label).width + 56;
    const s = ok ? E.outBack(seg(t, FLASH, FLASH + 0.35)) : 1;
    ctx.translate(W / 2, 78); ctx.scale(s, s);
    roundRect(-w / 2, -21, w, 42, 21); ctx.fillStyle = rgba(dot, 0.14); ctx.fill(); ctx.strokeStyle = rgba(dot, 0.8); ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = dot; ctx.globalAlpha = a * (ok ? 1 : 0.5 + 0.5 * Math.sin(t * 10)); ctx.beginPath(); ctx.arc(-w / 2 + 22, 0, 6, 0, TAU); ctx.fill();
    ctx.globalAlpha = a;
    text(label, -w / 2 + 38, 1, { size: 22, weight: 700, font: MONO, color: dot, base: 'middle' });
    ctx.restore();
    // rounds
    const rounds = Math.min(3, 1 + Math.floor(seg(t, MSG_T0, 6.9) * 3));
    text(`round ${rounds}/3`, W - 72, 86, { size: 22, font: MONO, color: C.muted, align: 'right', alpha: a });
  }
  // timecode
  if (t > 0.3 && t < 13.7) {
    const s = Math.floor(f / FPS), fr = f % FPS;
    text(`IND · ${String(s).padStart(2, '0')}:${String(fr).padStart(2, '0')}`, W - 72, H - 64, { size: 18, font: MONO, color: C.muted, align: 'right', alpha: 0.7 * seg(t, 0.3, 0.8) * (1 - seg(t, 13.4, 13.7)), spacing: 2 });
    // frame corners
    ctx.save(); ctx.strokeStyle = rgba(C.ochre, 0.35 * seg(t, 0.3, 0.9) * (1 - seg(t, 13.4, 13.7))); ctx.lineWidth = 2;
    const m = 40, L = 34;
    for (const [x, y, dx, dy] of [[m, m, 1, 1], [W - m, m, -1, 1], [m, H - m, 1, -1], [W - m, H - m, -1, -1]]) { ctx.beginPath(); ctx.moveTo(x, y + dy * L); ctx.lineTo(x, y); ctx.lineTo(x + dx * L, y); ctx.stroke(); }
    ctx.restore();
  }
}
function headline(t) {
  // act one: beside the council
  const hx = SHORT ? 80 : 132, hy = SHORT ? 330 : 470;
  riseLine([['Let', C.ink], ['your', C.ink], ['agents', C.ink]], hx, hy, SHORT ? 104 : 96, 2.25, t, { out: 3.85 });
  riseLine([['argue.', C.ember]], hx, hy + (SHORT ? 190 : 170), SHORT ? 200 : 176, 2.5, t, { out: 3.9, dur: 0.7 });
  typeOn(SHORT ? 'six roles · one council' : 'six roles · one council · cross-examined', hx + 6, hy + (SHORT ? 280 : 260), 2.9, t, 55, { size: SHORT ? 30 : 24, font: MONO, color: C.muted, alpha: 1 - seg(t, 3.8, 4.0) });
  // act two: with the graph
  if (SHORT) {
    riseLine([['A', C.ink], ['graph', C.ink]], 80, 230, 92, 9.1, t, { out: 11.95 });
    riseLine([['with', C.ink], ['gates.', C.ember]], 80, 330, 92, 9.2, t, { out: 12.0 });
  } else riseLine([['A', C.ink], ['graph', C.ink], ['with', C.ink], ['gates.', C.ember]], 132, 900, 80, 9.1, t, { out: 11.95 });
  if (t > FLASH - 0.05 && t < 8.0) {
    const k = E.outExpo(seg(t, FLASH, FLASH + 0.5));
    const a = 1 - seg(t, 7.72, 7.95);
    ctx.save(); ctx.globalAlpha = a; ctx.font = `800 ${132}px ${SANS}`;
    ctx.letterSpacing = `${lerp(60, 14, k)}px`; ctx.textAlign = 'center';
    ctx.fillStyle = rgba(C.sage, 0.95 * k);
    ctx.shadowColor = C.sage; ctx.shadowBlur = 40 * (1 - k) + 10;
    ctx.fillText('AGREED', W / 2, SHORT ? 330 : 190);
    ctx.restore();
  }
}
function giantType(t) {
  // the opening: INDABA, huge and hollow, spreading as the fire takes
  const k = seg(t, 0.15, 1.9);
  if (k <= 0 || k >= 1) return;
  ctx.save();
  ctx.globalAlpha = Math.sin(k * Math.PI) * 0.22;
  ctx.font = `800 ${SHORT ? 190 : 300}px ${SANS}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.letterSpacing = `${lerp(6, SHORT ? 22 : 46, E.outCubic(k))}px`;
  ctx.strokeStyle = C.ochre; ctx.lineWidth = 2;
  ctx.strokeText('INDABA', W / 2, H / 2 + 10);
  ctx.restore();
}
function post(t, f) {
  // flash on consensus, the dive into the fire, the cut, the mark
  const flashes = [[0.62, 0.35, '#ffcf8a', 0.35], [FLASH, 0.5, '#d8ffe8', 0.45], [13.84, 0.4, '#ffd9a0', 0.5]];
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const [t0, d, col, a] of flashes) { const k = seg(t, t0, t0 + d); if (k > 0 && k < 1) { ctx.fillStyle = rgba(col, a * (1 - E.outCubic(k))); ctx.fillRect(0, 0, W, H); } }
  ctx.restore();
  // the fire fills the frame on the dive, then opens on the run
  const fill = E.inCubic(seg(t, 7.95, RUN0)) * (1 - E.outCubic(seg(t, RUN0, RUN0 + 0.45)));
  if (fill > 0) {
    const g = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, BIG * 0.7);
    g.addColorStop(0, rgba('#ffe7b0', fill)); g.addColorStop(0.5, rgba('#ff9a4d', fill)); g.addColorStop(1, rgba('#7a2a08', fill));
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  // glitch on the failed gate
  if (t >= FAIL && t < FAIL + 0.24) {
    sctx.clearRect(0, 0, W, H); sctx.drawImage(cv, 0, 0);
    const r = rng(1000 + f);
    for (let i = 0; i < 14; i++) {
      const y = Math.floor(r() * H), h = 8 + Math.floor(r() * 60), dx = (r() - 0.5) * 120;
      ctx.drawImage(scratch, 0, y, W, h, dx, y, W, h);
    }
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.35;
    ctx.drawImage(scratch, 8, 0); ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = rgba(C.fail, 0.12 * (1 - seg(t, FAIL, FAIL + 0.24))); ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }
  // vignette
  const v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, BIG * 0.72);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.62)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  // film grain
  ctx.save(); ctx.globalAlpha = 0.07; ctx.globalCompositeOperation = 'overlay';
  const gr = grains[f % 4]; const r = rng(f + 3); const ox = -Math.floor(r() * 384), oy = -Math.floor(r() * 384);
  for (let y = oy; y < H; y += 384) for (let x = ox; x < W; x += 384) ctx.drawImage(gr, x, y);
  ctx.restore();
  // fade in from black and a hair of black at the end of the first beat
  const fin = 1 - seg(t, 0, 0.25);
  if (fin > 0) { ctx.fillStyle = `rgba(0,0,0,${fin})`; ctx.fillRect(0, 0, W, H); }
}

function render(t) {
  const f = Math.round(t * FPS);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  background(t);
  embers(t);
  giantType(t);
  const cam = camera(t);
  ctx.save();
  ctx.translate(W / 2, H / 2); ctx.rotate(cam.rot); ctx.scale(cam.z, cam.z); ctx.translate(-cam.cx, -cam.cy);
  drawCouncil(t);
  drawRun(t);
  ctx.restore();
  drawTraceText(t);
  drawMark(t);
  headline(t);
  hud(t, f);
  post(t, f);
}
window.render = render;
window.REEL = { W, H, FPS, DURATION };
</script>
</body>
</html>
