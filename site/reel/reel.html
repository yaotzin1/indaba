<!doctype html>
<!--
  The Indaba reel: 15 seconds, 1920x1080, drawn on a canvas by render(t), a pure function of the time in seconds.
  site/reel/render.mjs films it frame by frame into docs/assets/indaba-reel.mp4. Nothing here reads the clock or
  Math.random(), so the same source always gives the same film.

  The look is flat on purpose: solid fields, ink and paper from the site's two themes, hard irises and wipes between
  acts. No glow, particles, grain or interface chrome.

  Acts: 0.0 ignite · 1.5 the council gathers · 4.0 the debate · 7.0 consensus · 8.4 the run (a gate fails, the
  retry carries only the last failure, the gate passes) · 12.2 the trace · 13.6 the mark.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Indaba reel</title>
<style>
  html, body { margin: 0; background: #0c0805; }
  canvas { display: block; width: 1920px; height: 1080px; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ?short draws the vertical cut (1080x1920) for YouTube Shorts; the default is the landscape film of the site.
const SHORT = new URLSearchParams(location.search).has('short');
const W = SHORT ? 1080 : 1920, H = SHORT ? 1920 : 1080, FPS = 30, DURATION = 15;
const BIG = Math.max(W, H);
const cv = document.getElementById('c');
cv.width = W; cv.height = H; cv.style.width = `${W}px`; cv.style.height = `${H}px`;
const ctx = cv.getContext('2d');
const scratch = document.createElement('canvas');
scratch.width = W; scratch.height = H;
const sctx = scratch.getContext('2d');

// Colours from site/site.css: the light theme (paper and ink) and the dark theme (cave earth), plus a sage field
// for the moment of consensus. C is the current theme; render() points it at one per act. Flat colour only.
const THEMES = {
  paper: { bg: '#f2ebdf', ink: '#221c16', muted: '#65584a', line: '#d9ccb6', lineStrong: '#a8957a', ochre: '#94480f', ochreDeep: '#94480f', ochreSoft: '#e9cfa8', ember: '#c2410c', sage: '#24694a', sageSoft: '#cfe5d6', fail: '#b3261e', failSoft: '#f4d3cd', disc: '#221c16', figure: '#f2ebdf' },
  sage: { bg: '#24694a', ink: '#f2ebdf', muted: '#cfe5d6', line: '#3f8564', lineStrong: '#8fc4a8', ochre: '#f1c27a', ochreDeep: '#f1c27a', ochreSoft: '#2f7a57', ember: '#f1c27a', sage: '#f2ebdf', sageSoft: '#2f7a57', fail: '#ff8f82', failSoft: '#42201c', disc: '#f2ebdf', figure: '#24694a' },
  dark: { bg: '#1a130e', ink: '#f0e6d6', muted: '#b4a38e', line: '#3a2d23', lineStrong: '#6a5442', ochre: '#eab36a', ochreDeep: '#c2732b', ochreSoft: '#4a3520', ember: '#ff9a4d', sage: '#7cc9a0', sageSoft: '#1d3a2a', fail: '#ff8f82', failSoft: '#42201c', disc: '#f0e6d6', figure: '#1a130e' },
};
const C = { ...THEMES.paper };
const theme = (name) => Object.assign(C, THEMES[name]);
const SANS = "'Next', system-ui, sans-serif";
const MONO = "'Mono', ui-monospace, monospace";

// ---------- maths ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const TAU = Math.PI * 2;
const E = {
  outExpo: (k) => (k >= 1 ? 1 : 1 - Math.pow(2, -10 * k)),
  inExpo: (k) => (k <= 0 ? 0 : Math.pow(2, 10 * k - 10)),
  inOutExpo: (k) => k <= 0 ? 0 : k >= 1 ? 1 : k < 0.5 ? Math.pow(2, 20 * k - 10) / 2 : (2 - Math.pow(2, -20 * k + 10)) / 2,
  outCubic: (k) => 1 - Math.pow(1 - k, 3),
  inCubic: (k) => k * k * k,
  inOutCubic: (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2),
  outBack: (k) => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); },
  outElastic: (k) => k <= 0 ? 0 : k >= 1 ? 1 : Math.pow(2, -10 * k) * Math.sin((k * 10 - 0.75) * (TAU / 3)) + 1,
  outQuint: (k) => 1 - Math.pow(1 - k, 5),
};
function rng(seed) {
  return () => {
    seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
    let r = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  };
}
const hex = (h) => h[0] === '#' ? [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)] : h.match(/\d+/g).slice(0, 3).map(Number);
const mix = (a, b, k) => { const x = hex(a), y = hex(b); return `rgb(${x.map((v, i) => Math.round(lerp(v, y[i], k))).join(',')})`; };
const rgba = (h, a) => { const x = hex(h); return `rgba(${x[0]},${x[1]},${x[2]},${a})`; };
const quad = (p0, p1, p2, u) => ({
  x: (1 - u) * (1 - u) * p0.x + 2 * (1 - u) * u * p1.x + u * u * p2.x,
  y: (1 - u) * (1 - u) * p0.y + 2 * (1 - u) * u * p1.y + u * u * p2.y,
});

// ---------- prebuilt assets ----------
const FLAME = new Path2D('M400 316 C366 316 356 288 372 268 C374 282 384 284 386 276 C380 252 396 238 404 220 C410 242 432 256 430 282 C440 276 440 266 438 258 C456 280 440 316 400 316 Z');
const FLAME_IN = new Path2D('M400 314 C384 314 380 298 390 288 C392 296 398 296 399 290 C397 280 404 274 408 266 C412 278 420 284 418 296 C422 300 418 314 400 314 Z');

// ---------- drawing helpers ----------
function text(str, x, y, { size = 32, weight = 400, font = SANS, color = C.ink, align = 'left', base = 'alphabetic', alpha = 1, spacing = 0 } = {}) {
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.font = `${weight} ${size}px ${font}`;
  ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = base;
  if (spacing) ctx.letterSpacing = `${spacing}px`;
  ctx.fillText(str, x, y);
  ctx.restore();
}
// A line of type that rises out of a mask, word by word.
function riseLine(words, x, y, size, t0, t, { weight = 800, gap = 0.07, dur = 0.55, out = 1e9, outDur = 0.35, center = false } = {}) {
  ctx.save();
  ctx.font = `${weight} ${size}px ${SANS}`;
  let cx = x;
  if (center) cx = x - (words.reduce((a, [w]) => a + ctx.measureText(w).width, 0) + size * 0.26 * (words.length - 1)) / 2;
  words.forEach(([w, color], i) => {
    const k = E.outExpo(seg(t, t0 + i * gap, t0 + i * gap + dur));
    const ko = E.inCubic(seg(t, out + i * gap * 0.5, out + i * gap * 0.5 + outDur));
    const wd = ctx.measureText(w).width;
    ctx.save();
    ctx.beginPath(); ctx.rect(cx - 10, y - size * 1.05, wd + 20, size * 1.38); ctx.clip();
    ctx.fillStyle = color;
    ctx.fillText(w, cx, y + (1 - k) * size * 1.2 - ko * size * 1.6);
    ctx.restore();
    cx += wd + size * 0.26;
  });
  ctx.restore();
}
function typeOn(str, x, y, t0, t, _cps, opts = {}) {
  const k = E.outCubic(seg(t, t0, t0 + 0.4));
  if (k <= 0) return;
  text(str, x, y + (1 - k) * 14, { ...opts, alpha: (opts.alpha ?? 1) * k });
}
function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2))); }

function fire(x, y, s, t) {
  if (s <= 0.001) return;
  const fl = 1 + 0.06 * Math.sin(t * 11.1) + 0.03 * Math.sin(t * 19.7 + 1.3);
  const sk = 0.05 * Math.sin(t * 6.3) + 0.025 * Math.sin(t * 15.9);
  ctx.save();
  ctx.translate(x, y + 26 * s);
  ctx.scale(s * 1.05, s * fl);
  ctx.transform(1, 0, sk, 1, 0, 0);
  ctx.translate(-400, -316);
  ctx.fillStyle = '#d4450c'; ctx.fill(FLAME);
  ctx.fillStyle = '#f6b54a'; ctx.fill(FLAME_IN);
  ctx.restore();
}
function person(x, y, s, fill) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = fill;
  ctx.beginPath(); ctx.arc(0, -11, 9.5, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-15, 19); ctx.quadraticCurveTo(-15, 1, 0, 1); ctx.quadraticCurveTo(15, 1, 15, 19); ctx.closePath(); ctx.fill();
  ctx.restore();
}
// ---------- the council (world space, centre 960,540) ----------
const CX = W / 2, CY = SHORT ? 1080 : 540, R = SHORT ? 290 : 250;
const ROLES = ['architect', 'coder', 'reviewer', 'tester', 'security', 'scribe'];
const MSGS = [[0, 3], [3, 0], [1, 4], [2, 5], [4, 1], [5, 2], [0, 2], [3, 5], [1, 3], [4, 0], [2, 4], [5, 1], [0, 4], [3, 1], [2, 0], [5, 3]];
const WORDS = ['objection', 'evidence?', 'counter', 'cite the line', 'edge case', 'not yet', 'show the diff', 're-check', 'fair point', 'conceded', '+1', 'agreed', 'agreed', 'agreed', 'agreed', 'agreed'];
const MSG_T0 = 4.15, MSG_STEP = 0.165, MSG_DUR = 0.5;
const ringRot = (t) => 0.32 * E.inOutCubic(seg(t, 3.6, 7.6));
function agentAppear(i, t) { return E.outBack(seg(t, 1.55 + i * 0.09, 2.2 + i * 0.09)); }
function agentPos(i, t) {
  const a = -Math.PI / 2 + i * (TAU / 6) + ringRot(t);
  const r = R * agentAppear(i, t) + 4 * Math.sin(t * 2.1 + i);
  return { x: CX + Math.cos(a) * r, y: CY + Math.sin(a) * r, a };
}
const CONSENSUS = 7.05, FLASH = 7.38;

function drawCouncil(t) {
  // consensus: a sage field opens from the fire, flat, under everything
  const iris = E.outExpo(seg(t, FLASH, FLASH + 0.22));
  if (iris > 0) { ctx.fillStyle = THEMES.sage.bg; ctx.beginPath(); ctx.arc(CX, CY, iris * 2600, 0, TAU); ctx.fill(); }

  // rings drawing on
  const ringK = E.inOutCubic(seg(t, 0.7, 1.6));
  ctx.save();
  ctx.strokeStyle = C.lineStrong; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(CX, CY, R, -Math.PI / 2, -Math.PI / 2 + TAU * ringK); ctx.stroke();
  ctx.beginPath(); ctx.arc(CX, CY, R * 0.42, Math.PI / 2, Math.PI / 2 - TAU * ringK, true); ctx.stroke();
  ctx.setLineDash([2, 14]); ctx.lineCap = 'round'; ctx.lineWidth = 3; ctx.lineDashOffset = -t * 30;
  ctx.globalAlpha = ringK;
  ctx.beginPath(); ctx.arc(CX, CY, R + 42, 0, TAU); ctx.stroke();
  ctx.restore();

  // the mesh: a chord for every exchange that has landed
  MSGS.forEach(([a, b], m) => {
    const end = MSG_T0 + m * MSG_STEP + MSG_DUR;
    const k = seg(t, end - 0.05, end + 0.2);
    if (k <= 0) return;
    const p = agentPos(a, t), q = agentPos(b, t);
    ctx.strokeStyle = C.ink; ctx.globalAlpha = k * (t > FLASH ? 0.55 : 0.28); ctx.lineWidth = t > FLASH ? 2 : 1.5;
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();
  });
  ctx.globalAlpha = 1;

  // consensus: a line from every agent to the fire
  for (let i = 0; i < 6; i++) {
    const k = E.outExpo(seg(t, CONSENSUS + i * 0.035, CONSENSUS + 0.3 + i * 0.035));
    if (k <= 0) continue;
    const p = agentPos(i, t);
    ctx.strokeStyle = t > FLASH ? C.ink : C.sage; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(lerp(p.x, CX, k * 0.8), lerp(p.y, CY, k * 0.8)); ctx.stroke();
  }

  // messages: a solid dot with a short solid tail along a curve
  MSGS.forEach(([a, b], m) => {
    const t0 = MSG_T0 + m * MSG_STEP, k = seg(t, t0, t0 + MSG_DUR);
    if (k <= 0 || k >= 1) return;
    const p = agentPos(a, t), q = agentPos(b, t);
    const mx = (p.x + q.x) / 2, my = (p.y + q.y) / 2;
    const dx = q.x - p.x, dy = q.y - p.y, len = Math.hypot(dx, dy) || 1;
    const bend = (m % 2 ? 1 : -1) * 0.22 * len;
    const ctl = { x: mx - (dy / len) * bend, y: my + (dx / len) * bend };
    const col = m >= 10 ? C.sage : m % 3 === 0 ? C.ember : C.ochre;
    const head = E.inOutCubic(k), tail = Math.max(0, head - 0.28);
    ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath();
    for (let j = 0; j <= 16; j++) { const pt = quad(p, ctl, q, lerp(tail, head, j / 16)); j ? ctx.lineTo(pt.x, pt.y) : ctx.moveTo(pt.x, pt.y); }
    ctx.stroke();
    const h = quad(p, ctl, q, head); ctx.fillStyle = col; ctx.beginPath(); ctx.arc(h.x, h.y, 8, 0, TAU); ctx.fill();
    ctx.restore();
  });

  // agents: an ink disc with a paper figure
  for (let i = 0; i < 6; i++) {
    const ap = agentAppear(i, t);
    if (ap <= 0.001) continue;
    const p = agentPos(i, t);
    ctx.save();
    ctx.translate(p.x, p.y); ctx.scale(clamp(ap, 0, 1.4), clamp(ap, 0, 1.4));
    MSGS.forEach(([, b], m) => {
      if (b !== i) return;
      const e = MSG_T0 + m * MSG_STEP + MSG_DUR, k = seg(t, e, e + 0.4);
      if (k <= 0 || k >= 1) return;
      ctx.strokeStyle = m >= 10 ? C.sage : C.ember; ctx.globalAlpha = 1 - k; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, 40 + E.outCubic(k) * 26, 0, TAU); ctx.stroke(); ctx.globalAlpha = 1;
    });
    ctx.fillStyle = C.disc; ctx.beginPath(); ctx.arc(0, 0, 38, 0, TAU); ctx.fill();
    person(0, 2, 1.25, C.figure);
    ctx.restore();
    const lk = E.outExpo(seg(t, 2.0 + i * 0.07, 2.6 + i * 0.07)) * (1 - seg(t, 4.05, 4.3));
    if (lk > 0) {
      const lx = CX + Math.cos(p.a) * (R + 120), ly = CY + Math.sin(p.a) * (R + 120) + 8;
      text(ROLES[i], lx, ly, { size: 22, font: MONO, color: C.muted, align: 'center', alpha: lk, spacing: 1 });
    }
  }

  // word chips where messages land: solid pills
  MSGS.forEach(([, b], m) => {
    const e = MSG_T0 + m * MSG_STEP + MSG_DUR;
    const k = seg(t, e - 0.02, e + 0.2), ko = seg(t, e + 0.55, e + 0.7);
    if (k <= 0 || ko >= 1 || t > CONSENSUS + 0.25) return;
    const p = agentPos(b, t);
    const out = 96, side = (m % 2 ? 1 : -1) * 14;
    const x = p.x + Math.cos(p.a) * out - Math.sin(p.a) * side, y = p.y + Math.sin(p.a) * out + Math.cos(p.a) * side;
    const s = E.outBack(k) * (1 - E.inCubic(ko));
    const word = WORDS[m];
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    ctx.font = `700 21px ${MONO}`;
    const w = ctx.measureText(word).width + 30;
    roundRect(-w / 2, -20, w, 40, 20); ctx.fillStyle = m >= 10 ? C.sage : m % 3 === 0 ? C.ember : C.ink; ctx.fill();
    text(word, 0, 1, { size: 21, weight: 700, font: MONO, color: C.bg, align: 'center', base: 'middle' });
    ctx.restore();
  });

  // the fire at the centre, and the spark that lights it
  const fireS = E.outBack(seg(t, 0.58, 1.1)) * (1 + 0.35 * (t > FLASH ? Math.exp(-(t - FLASH) * 5) : 0));
  fire(CX, CY, fireS * 1.35, t);
  const sk = seg(t, 0.0, 0.6);
  if (sk > 0 && sk < 1) {
    const y = lerp(CY + 700, CY, E.inCubic(sk));
    ctx.strokeStyle = C.ember; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(CX, y + 30 + 80 * sk); ctx.lineTo(CX, y); ctx.stroke();
    ctx.fillStyle = C.ember; ctx.beginPath(); ctx.arc(CX, y, 9, 0, TAU); ctx.fill();
  }

  // into the run: an ember iris from the fire, then the dark one
  const e1 = E.inOutCubic(seg(t, 7.72, 8.05)), e2 = E.inOutCubic(seg(t, 7.98, 8.36));
  if (e1 > 0) { ctx.fillStyle = '#d4450c'; ctx.beginPath(); ctx.arc(CX, CY, e1 * 2600, 0, TAU); ctx.fill(); }
  if (e2 > 0) { ctx.fillStyle = THEMES.dark.bg; ctx.beginPath(); ctx.arc(CX, CY, e2 * 2600, 0, TAU); ctx.fill(); }
}

// ---------- the run (world space of its own) ----------
// Landscape: the graph runs left to right. Short: top to bottom, labels to the right of the nodes.
const RY = 540, RUN0 = 8.4;
const NODES = ['spec', 'plan', 'code', 'gate', 'review', 'done'].map((id, i) => ({
  id, gate: id === 'gate', x: SHORT ? 440 : 300 + i * 330, y: SHORT ? 400 + i * 236 : RY,
}));
const RUN_MID = SHORT ? { x: 440, y: (NODES[0].y + NODES[5].y) / 2 } : { x: 1125, y: RY };
const FAIL = 10.0, PASS = 11.25;
// The token's journey: [t0, t1, from, to] by node index, or the retry arc.
const LEGS = [[8.85, 9.2, 0, 1], [9.25, 9.6, 1, 2], [9.65, 10.0, 2, 3], [10.25, 10.85, 3, 2, 'arc'], [10.9, 11.25, 2, 3], [11.3, 11.65, 3, 4], [11.7, 12.05, 4, 5]];
const ARC_CTL = SHORT ? { x: 440 - 300, y: (NODES[2].y + NODES[3].y) / 2 } : { x: 1125, y: RY - 300 };
function tokenAt(t) {
  if (t < LEGS[0][0]) return { x: NODES[0].x, y: NODES[0].y, moving: false };
  for (const [a, b, f, to, arc] of LEGS) {
    if (t >= a && t <= b) {
      const u = E.inOutCubic(seg(t, a, b));
      const p = NODES[f], q = NODES[to];
      if (arc) return { ...quad(p, ARC_CTL, q, u), moving: true, arc: true, u };
      return { x: lerp(p.x, q.x, u), y: lerp(p.y, q.y, u), moving: true, u };
    }
  }
  for (let i = LEGS.length - 1; i >= 0; i--) if (t > LEGS[i][1]) return { x: NODES[LEGS[i][3]].x, y: NODES[LEGS[i][3]].y, moving: false };
  return { x: NODES[0].x, y: NODES[0].y, moving: false };
}
function nodeLit(i, t) {
  const arrive = [8.5, 9.2, 9.6, 10.0, 11.65, 12.05][i];
  return E.outExpo(seg(t, arrive, arrive + 0.25));
}
function nodeIcon(n, t, col) {
  ctx.save(); ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 3; ctx.lineCap = 'round';
  if (n.id === 'spec') { for (let j = 0; j < 3; j++) { ctx.beginPath(); ctx.moveTo(-14, -9 + j * 9); ctx.lineTo(j === 2 ? 4 : 14, -9 + j * 9); ctx.stroke(); } }
  else if (n.id === 'plan') { ctx.beginPath(); ctx.moveTo(-12, -8); ctx.lineTo(0, 8); ctx.lineTo(12, -8); ctx.stroke(); for (const [x, y] of [[-12, -8], [0, 8], [12, -8]]) { ctx.beginPath(); ctx.arc(x, y, 4.5, 0, TAU); ctx.fill(); } }
  else if (n.id === 'code') { text('</>', 0, 2, { size: 26, weight: 700, font: MONO, color: col, align: 'center', base: 'middle' }); }
  else if (n.id === 'review') { ctx.beginPath(); ctx.ellipse(0, 0, 16, 10, 0, 0, TAU); ctx.stroke(); ctx.beginPath(); ctx.arc(0, 0, 4.5, 0, TAU); ctx.fill(); }
  else if (n.id === 'done') { ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(-12, 1); ctx.lineTo(-3, 10); ctx.lineTo(13, -9); ctx.stroke(); }
  ctx.restore();
}

// The trace rows the nodes turn into (screen space once the camera settles).
const ROWS = [
  { label: 'run', a: 0, b: 1, col: 'ochre' },
  { label: 'spec', a: 0, b: 0.11, col: 'ochre' },
  { label: 'plan', a: 0.12, b: 0.24, col: 'ochre' },
  { label: 'code', a: 0.25, b: 0.41, col: 'ochre' },
  { label: 'gate  ✕', a: 0.42, b: 0.47, col: 'fail' },
  { label: 'code  · retry', a: 0.49, b: 0.66, col: 'ember' },
  { label: 'gate  ✓', a: 0.67, b: 0.72, col: 'sage' },
  { label: 'review', a: 0.73, b: 0.93, col: 'ochre' },
];
const BAR_X = SHORT ? 300 : 560, BAR_W = SHORT ? 640 : 1100, ROW_Y = SHORT ? 640 : 352, ROW_STEP = SHORT ? 74 : 56, ROW_H = SHORT ? 34 : 28;
const NODE_ROW = [1, 2, 3, 4, 7, 0];
function rowRect(r) { const row = ROWS[r]; return { x: BAR_X + row.a * BAR_W, y: ROW_Y + r * ROW_STEP, w: (row.b - row.a) * BAR_W, h: ROW_H }; }
const MORPH0 = 12.2, MORPH1 = 12.8, COLLAPSE = 13.5;

function drawRun(t) {
  if (t < RUN0 - 0.01 || t > 13.95) return;
  const morph = E.inOutCubic(seg(t, MORPH0, MORPH1));
  const collapse = E.inExpo(seg(t, COLLAPSE, 13.9));
  const graphA = 1 - seg(t, MORPH0, MORPH0 + 0.25);

  // edges
  for (let i = 0; i < NODES.length - 1; i++) {
    const k = E.outExpo(seg(t, RUN0 + 0.15 + i * 0.09, RUN0 + 0.6 + i * 0.09));
    if (k <= 0 || graphA <= 0) continue;
    const a = NODES[i], b = NODES[i + 1];
    const ux = Math.sign(b.x - a.x), uy = Math.sign(b.y - a.y);
    const x0 = a.x + 50 * ux, y0 = a.y + 50 * uy, x1 = lerp(x0, b.x - 50 * ux, k), y1 = lerp(y0, b.y - 50 * uy, k);
    ctx.save(); ctx.globalAlpha = graphA; ctx.lineWidth = 3;
    const lit = nodeLit(i + 1, t);
    ctx.strokeStyle = lit > 0 ? (i >= 2 && t > PASS ? C.sage : C.ochre) : C.lineStrong;
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    ctx.restore();
  }
  // retry arc
  const arcK = seg(t, FAIL + 0.15, FAIL + 0.5);
  if (arcK > 0 && graphA > 0) {
    ctx.save(); ctx.globalAlpha = graphA;
    ctx.strokeStyle = C.ember; ctx.lineWidth = 3; ctx.setLineDash([10, 9]);
    ctx.beginPath();
    const steps = 40, p = NODES[3], q = NODES[2];
    for (let st = 0; st <= steps * E.outExpo(arcK); st++) { const pt = quad(p, ARC_CTL, q, st / steps); st ? ctx.lineTo(pt.x, pt.y) : ctx.moveTo(pt.x, pt.y); }
    ctx.stroke(); ctx.setLineDash([]);
    text('retry · isolated', SHORT ? 150 : ARC_CTL.x, SHORT ? ARC_CTL.y + 70 : RY - 252, { size: 22, font: MONO, color: C.ember, align: 'center', alpha: E.outExpo(seg(t, FAIL + 0.35, FAIL + 0.7)) });
    ctx.restore();
  }

  // nodes: outlined until reached, then filled; they become the trace bars
  NODES.forEach((n, i) => {
    const ap = E.outBack(seg(t, RUN0 + 0.05 + i * 0.08, RUN0 + 0.5 + i * 0.08));
    if (ap <= 0.001) return;
    const lit = nodeLit(i, t);
    let solid = C.ochre;
    let shakeX = 0;
    if (n.gate) {
      if (t >= FAIL && t < PASS) solid = C.fail;
      if (t >= PASS) solid = C.sage;
      if (t > FAIL && t < FAIL + 0.35) shakeX = Math.sin(t * 90) * 10 * (1 - seg(t, FAIL, FAIL + 0.35));
    }
    if (n.id === 'done' && t >= 12.05) solid = C.sage;
    if (n.id === 'code' && t > FAIL + 0.85 && t < 11.25) solid = C.ember;
    let fill = mix(C.bg, solid, lit), stroke = mix(C.lineStrong, solid, lit), icon = mix(C.muted, C.bg, lit);

    const r = rowRect(NODE_ROW[i]);
    const rowCol = C[ROWS[NODE_ROW[i]].col];
    let cx = lerp(n.x + shakeX, r.x + r.w / 2, morph), cy = lerp(n.y, r.y + r.h / 2, morph);
    let w = lerp(96, r.w, morph), h = lerp(96, r.h, morph);
    if (morph > 0) { fill = mix(fill, rowCol, morph); stroke = mix(stroke, rowCol, morph); }
    if (collapse > 0) { cx = lerp(cx, W / 2, collapse); cy = lerp(cy, H / 2, collapse); w = lerp(w, 6, collapse); h = lerp(h, 6, collapse); }
    const sc = clamp(ap, 0, 1.4);
    ctx.save(); ctx.globalAlpha = 1 - seg(t, 13.75, 13.9);
    ctx.translate(cx, cy); ctx.scale(sc, sc);
    if (n.gate) ctx.rotate((Math.PI / 4) * (1 - morph));
    const rad = n.gate ? lerp(10, 4, morph) : lerp(48, 4, morph);
    const gw = n.gate ? lerp(76, w, morph) : w, gh = n.gate ? lerp(76, h, morph) : h;
    roundRect(-gw / 2, -gh / 2, gw, gh, rad);
    ctx.fillStyle = fill; ctx.fill(); ctx.strokeStyle = stroke; ctx.lineWidth = 3; ctx.stroke();
    if (n.gate) ctx.rotate(-(Math.PI / 4) * (1 - morph));
    ctx.globalAlpha *= 1 - seg(morph, 0, 0.3);
    if (n.gate) {
      ctx.lineCap = 'round'; ctx.lineWidth = 5; ctx.strokeStyle = icon; ctx.fillStyle = icon;
      if (t >= FAIL && t < PASS) { const d = 13 * E.outExpo(seg(t, FAIL, FAIL + 0.15)); ctx.beginPath(); ctx.moveTo(-d, -d); ctx.lineTo(d, d); ctx.moveTo(d, -d); ctx.lineTo(-d, d); ctx.stroke(); }
      else if (t >= PASS) { const pk = E.outExpo(seg(t, PASS, PASS + 0.25)), m = Math.min(1, pk * 2); ctx.beginPath(); ctx.moveTo(-14, 1); ctx.lineTo(lerp(-14, -4, m), lerp(1, 11, m)); if (pk > 0.5) ctx.lineTo(lerp(-4, 15, (pk - 0.5) * 2), lerp(11, -10, (pk - 0.5) * 2)); ctx.stroke(); }
      else { ctx.beginPath(); ctx.arc(0, 0, 6, 0, TAU); ctx.fill(); }
    } else nodeIcon(n, t, icon);
    ctx.restore();

    if (graphA > 0) {
      const lk = E.outExpo(seg(t, RUN0 + 0.3 + i * 0.08, RUN0 + 0.8 + i * 0.08));
      const lx = SHORT ? n.x + 82 : n.x, ly = SHORT ? n.y - 2 : RY + 92;
      text(n.id, lx, ly, { size: SHORT ? 34 : 26, font: MONO, weight: 700, color: mix(C.muted, C.ink, lit), align: SHORT ? 'left' : 'center', alpha: lk * graphA, spacing: 1 });
      let pill = null;
      if (n.gate && t > FAIL && t < PASS) pill = ['exit 1', C.fail, FAIL];
      if (n.gate && t >= PASS) pill = ['passed', C.sage, PASS];
      if (n.id === 'code' && t > FAIL + 0.85) pill = ['retry 1', C.ember, FAIL + 0.85];
      if (n.id === 'done' && t > 12.05) pill = ['finished', C.sage, 12.05];
      if (pill) {
        const pk = E.outBack(seg(t, pill[2], pill[2] + 0.25));
        ctx.font = `700 20px ${MONO}`; const pw = ctx.measureText(pill[0]).width + 28;
        ctx.save(); ctx.globalAlpha = graphA; ctx.translate(SHORT ? n.x + 82 + pw / 2 : n.x, SHORT ? n.y + 38 : RY + 136); ctx.scale(pk, pk);
        roundRect(-pw / 2, -18, pw, 36, 18); ctx.fillStyle = pill[1]; ctx.fill();
        text(pill[0], 0, 1, { size: 20, weight: 700, font: MONO, color: C.bg, align: 'center', base: 'middle' });
        ctx.restore();
      }
    }
  });

  // the token
  const tok = tokenAt(t);
  if (graphA > 0 && t < 12.1) {
    const col = tok.arc ? C.ember : t > PASS ? C.sage : C.ink;
    ctx.save(); ctx.globalAlpha = graphA;
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(tok.x, tok.y, 10, 0, TAU); ctx.fill();
    ctx.restore();
    if (tok.arc) {
      const ck = E.outBack(seg(t, 10.25, 10.42)) * (1 - seg(t, 10.75, 10.85));
      ctx.save(); ctx.translate(tok.x, tok.y - 46); ctx.scale(ck, ck);
      ctx.font = `700 21px ${MONO}`; const w = ctx.measureText('only the last failure').width + 30;
      roundRect(-w / 2, -20, w, 40, 20); ctx.fillStyle = C.ember; ctx.fill();
      text('only the last failure', 0, 1, { size: 21, weight: 700, font: MONO, color: C.bg, align: 'center', base: 'middle' });
      ctx.restore();
    }
  }

  // the bars only the trace has
  for (const r of [5, 6]) {
    const k = E.outExpo(seg(t, MORPH1 - 0.15 + (r - 5) * 0.08, MORPH1 + 0.3 + (r - 5) * 0.08));
    if (k <= 0) continue;
    let { x, y, w, h } = rowRect(r); w *= k;
    if (collapse > 0) { x = lerp(x, W / 2, collapse); y = lerp(y, H / 2, collapse); w = lerp(w, 4, collapse); h = lerp(h, 4, collapse); }
    ctx.save(); ctx.globalAlpha = 1 - seg(t, 13.75, 13.9);
    roundRect(x, y, w, h, 4); ctx.fillStyle = C[ROWS[r].col]; ctx.fill();
    ctx.restore();
  }
}

// trace overlay in screen space (labels, axis, title)
function drawTraceText(t) {
  const a = (1 - seg(t, COLLAPSE - 0.1, COLLAPSE + 0.15));
  if (t < MORPH0 + 0.2 || a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  if (SHORT) {
    riseLine([['Every', C.ink], ['token', C.ink]], 80, 380, 108, MORPH0 + 0.3, t, { out: COLLAPSE - 0.15 });
    riseLine([['counted.', C.ochre]], 80, 500, 108, MORPH0 + 0.42, t, { out: COLLAPSE - 0.1 });
  } else riseLine([['Every', C.ink], ['token', C.ink], ['counted.', C.ochre]], 140, 240, 84, MORPH0 + 0.3, t, { out: COLLAPSE - 0.15 });
  ROWS.forEach((row, r) => {
    const k = E.outExpo(seg(t, MORPH0 + 0.35 + r * 0.05, MORPH0 + 0.8 + r * 0.05));
    text(row.label, BAR_X - 24 - (1 - k) * 30, ROW_Y + r * ROW_STEP + ROW_H * 0.8, { size: SHORT ? 24 : 22, font: MONO, color: r === 0 ? C.ink : C.muted, align: 'right', alpha: k });
  });
  // time axis
  const ak = E.inOutCubic(seg(t, MORPH0 + 0.5, MORPH0 + 1.0));
  ctx.strokeStyle = C.lineStrong; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(BAR_X, ROW_Y - 22); ctx.lineTo(BAR_X + BAR_W * ak, ROW_Y - 22); ctx.stroke();
  for (let i = 0; i <= 10; i++) { if (i / 10 > ak) break; ctx.beginPath(); ctx.moveTo(BAR_X + BAR_W * i / 10, ROW_Y - 28); ctx.lineTo(BAR_X + BAR_W * i / 10, ROW_Y - 16); ctx.stroke(); }
  if (SHORT) {
    const y0 = ROW_Y + ROWS.length * ROW_STEP + 50;
    ['gen_ai.usage.input_tokens', 'gen_ai.usage.output_tokens', 'cost: from the provider, or unknown'].forEach((l, i) =>
      typeOn(l, 80, y0 + i * 44, MORPH0 + 0.6 + i * 0.25, t, 90, { size: 26, font: MONO, color: C.muted }));
  } else typeOn('gen_ai.usage.input_tokens · gen_ai.usage.output_tokens · cost: from the provider, or unknown', 140, ROW_Y + ROWS.length * ROW_STEP + 52, MORPH0 + 0.6, t, 120, { size: 22, font: MONO, color: C.muted });
  ctx.restore();
}

// ---------- the mark ----------
const MARK = SHORT ? { x: 540, y: 640, r: 175 } : { x: 650, y: 470, r: 128 };
function drawMark(t) {
  const t0 = 13.85;
  if (t < t0) return;
  const s0 = MARK.r / 96;
  const k = E.outBack(seg(t, t0, t0 + 0.5));
  ctx.save(); ctx.translate(MARK.x, MARK.y); ctx.scale(s0 * k, s0 * k);
  const disk = ctx.createRadialGradient(0, 16, 0, 0, 16, 125);
  disk.addColorStop(0, '#5a3320'); disk.addColorStop(1, '#150b07');
  ctx.fillStyle = disk; ctx.beginPath(); ctx.arc(0, 0, 96, 0, TAU); ctx.fill();
  const rk = E.inOutCubic(seg(t, t0 + 0.05, t0 + 0.55));
  const og = ctx.createLinearGradient(-96, -96, 96, 96); og.addColorStop(0, '#f1c27a'); og.addColorStop(1, '#c2732b');
  ctx.strokeStyle = og; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, 96, -Math.PI / 2, -Math.PI / 2 + TAU * rk); ctx.stroke();
  ctx.strokeStyle = 'rgba(194,115,43,0.8)'; ctx.lineWidth = 1.5; ctx.setLineDash([1, 6]); ctx.lineCap = 'round'; ctx.lineDashOffset = -t * 8;
  ctx.beginPath(); ctx.arc(0, 0, 88, 0, TAU * rk); ctx.stroke(); ctx.setLineDash([]);
  ctx.strokeStyle = 'rgba(194,115,43,0.45)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(0, 0, 46, 0, TAU); ctx.stroke();
  for (let i = 0; i < 6; i++) {
    const pk = E.outBack(seg(t, t0 + 0.12 + i * 0.05, t0 + 0.5 + i * 0.05));
    if (pk <= 0) continue;
    ctx.save(); ctx.rotate(i * TAU / 6);
    ctx.translate(0, lerp(10, 66, pk));
    const g = ctx.createLinearGradient(-10, -10, 10, 10); g.addColorStop(0, '#f1c27a'); g.addColorStop(1, '#c2732b');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, -11 + 0, 7.5 * pk, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-11 * pk, 10); ctx.quadraticCurveTo(-11 * pk, -3, 0, -3); ctx.quadraticCurveTo(11 * pk, -3, 11 * pk, 10); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  // persons in the SVG sit at y 155-176 of 200, i.e. about 66 from the centre, facing in: flip the drawing
  ctx.restore();
  fire(MARK.x, MARK.y + 4 * s0, 0.44 * s0 * E.outBack(seg(t, t0 + 0.2, t0 + 0.6)), t);

  // wordmark and lines
  const wx = SHORT ? 540 - 300 : MARK.x + MARK.r + 64, wy = SHORT ? 1060 : MARK.y + 58;
  if (SHORT) riseLine([['Indaba', C.ink]], 540, wy, 200, t0 + 0.15, t, { weight: 800, dur: 0.7, center: true });
  else riseLine([['Indaba', C.ink]], wx, wy, 176, t0 + 0.15, t, { weight: 800, dur: 0.7 });
  const lk = E.outExpo(seg(t, t0 + 0.4, t0 + 0.9));
  const ulx = SHORT ? 540 - 300 * lk : wx + 6, ulw = SHORT ? 600 * lk : 560 * lk, uly = SHORT ? wy + 46 : MARK.y + 96;
  ctx.save(); ctx.globalAlpha = lk; ctx.strokeStyle = C.ochreDeep; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(ulx, uly); ctx.lineTo(ulx + ulw, uly); ctx.stroke(); ctx.restore();
  if (SHORT) {
    riseLine([['Let', C.ink], ['your', C.ink], ['agents', C.ink], ['argue.', C.ink]], 540, 1230, 62, t0 + 0.35, t, { weight: 700, gap: 0.04, dur: 0.5, center: true });
    riseLine([['Ship', C.ochre], ['what', C.ochre], ['they', C.ochre], ['agree', C.ochre], ['on.', C.ochre]], 540, 1314, 62, t0 + 0.45, t, { weight: 700, gap: 0.04, dur: 0.5, center: true });
    ctx.save(); ctx.font = `400 30px ${MONO}`; const cw = ctx.measureText('github.com/yaotzin1/indaba').width; ctx.restore();
    typeOn('github.com/yaotzin1/indaba', 540 - cw / 2, 1420, t0 + 0.6, t, 70, { size: 30, font: MONO, color: C.ochre });
  } else {
    riseLine([['Let', C.ink], ['your', C.ink], ['agents', C.ink], ['argue.', C.ink], ['Ship', C.ochre], ['what', C.ochre], ['they', C.ochre], ['agree', C.ochre], ['on.', C.ochre]], 330, 760, 52, t0 + 0.35, t, { weight: 700, gap: 0.035, dur: 0.5 });
    typeOn('$ npx indaba@next run workflow.ai.yml', 332, 838, t0 + 0.55, t, 110, { size: 28, font: MONO, color: C.muted });
  }
}

// ---------- camera ----------
function camera(t) {
  let cx = CX, cy = CY, z = 1, rot = 0;
  if (t < RUN0) {
    z = lerp(1.45, 1.0, E.outExpo(seg(t, 0.55, 1.7)));
    const side = E.inOutCubic(seg(t, 1.75, 2.55)) * (1 - E.inOutCubic(seg(t, 3.9, 4.55)));
    if (SHORT) { cy = lerp(CY, 770, side); z = lerp(z, 0.9, side); } else { cx = lerp(CX, 560, side); z = lerp(z, 0.84, side); }
    z *= lerp(1, 1.13, E.inOutCubic(seg(t, 4.4, 7.2)));
    const punch = t > FLASH ? Math.exp(-(t - FLASH) * 6) * Math.sin((t - FLASH) * 30) * 0.03 : 0;
    z *= 1 + punch + (t > FLASH ? 0.04 * E.outExpo(seg(t, FLASH, FLASH + 0.4)) : 0);
  } else {
    // pull out of the first node, follow the token, settle on the whole graph
    const pull = E.outExpo(seg(t, RUN0, RUN0 + 0.8));
    const follow = E.inOutCubic(seg(t, 9.0, 10.1));
    const tok = tokenAt(t);
    cx = lerp(tok.x, RUN_MID.x, follow);
    const cyRun = lerp(tok.y, RUN_MID.y, follow);
    z = lerp(6, lerp(SHORT ? 1.25 : 1.55, SHORT ? 0.88 : 0.94, follow), pull);
    z *= lerp(1, 1.04, seg(t, 10.1, MORPH0));
    cy = cyRun;
    if (t > FAIL && t < FAIL + 0.45) { const d = 1 - seg(t, FAIL, FAIL + 0.45); cx += Math.sin(t * 97) * 16 * d; cy += Math.cos(t * 83) * 11 * d; }
    // settle to identity for the trace
    const m = E.inOutCubic(seg(t, MORPH0, MORPH1));
    cx = lerp(cx, W / 2, m); cy = lerp(cy, H / 2, m); z = lerp(z, 1, m);
  }
  return { cx, cy, z, rot };
}

// ---------- frame ----------
function background(t) {
  // paper until the run, dark for the run, paper rising from the bottom for the trace; the failed gate turns the
  // field red for three frames
  ctx.fillStyle = t < 8.4 ? THEMES.paper.bg : THEMES.dark.bg;
  if (t >= FAIL && t < FAIL + 0.1) ctx.fillStyle = THEMES.paper.fail;
  ctx.fillRect(0, 0, W, H);
  const up = E.inOutCubic(seg(t, MORPH0, MORPH0 + 0.4));
  if (up > 0) { ctx.fillStyle = THEMES.paper.bg; ctx.fillRect(0, H * (1 - up), W, H * up); }
}
function headline(t) {
  // act one: beside the council
  const hx = SHORT ? 80 : 132, hy = SHORT ? 330 : 470;
  riseLine([['Let', C.ink], ['your', C.ink], ['agents', C.ink]], hx, hy, SHORT ? 104 : 96, 2.25, t, { out: 3.85 });
  riseLine([['argue.', C.ember]], hx, hy + (SHORT ? 190 : 170), SHORT ? 200 : 176, 2.5, t, { out: 3.9, dur: 0.7 });
  typeOn(SHORT ? 'six roles · one council' : 'six roles · one council · cross-examined', hx + 6, hy + (SHORT ? 280 : 260), 2.9, t, 55, { size: SHORT ? 30 : 24, font: MONO, color: C.muted, alpha: 1 - seg(t, 3.8, 4.0) });
  // act two: with the graph
  if (SHORT) {
    riseLine([['A', C.ink], ['graph', C.ink]], 80, 230, 92, 9.1, t, { out: 11.95 });
    riseLine([['with', C.ink], ['gates.', C.ember]], 80, 330, 92, 9.2, t, { out: 12.0 });
  } else riseLine([['A', C.ink], ['graph', C.ink], ['with', C.ink], ['gates.', C.ember]], 132, 900, 80, 9.1, t, { out: 11.95 });
  if (t > FLASH && t < 7.8) {
    const k = E.outExpo(seg(t, FLASH, FLASH + 0.5));
    const a = 1 - seg(t, 7.7, 7.8);
    ctx.save(); ctx.globalAlpha = a; ctx.font = `800 ${132}px ${SANS}`; ctx.shadowBlur = 0;
    ctx.letterSpacing = `${lerp(60, 14, k)}px`; ctx.textAlign = 'center';
    ctx.fillStyle = C.ink;
    ctx.fillText('AGREED', W / 2, SHORT ? 330 : 190);
    ctx.restore();
  }
}
function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  theme(t < FLASH ? 'paper' : t < 8.05 ? 'sage' : t < MORPH0 + 0.2 ? 'dark' : 'paper');
  background(t);
  const cam = camera(t);
  ctx.save();
  ctx.translate(W / 2, H / 2); ctx.scale(cam.z, cam.z); ctx.translate(-cam.cx, -cam.cy);
  if (t < 8.4) drawCouncil(t);
  drawRun(t);
  ctx.restore();
  drawTraceText(t);
  drawMark(t);
  headline(t);
}
window.render = render;
window.REEL = { W, H, FPS, DURATION };
</script>
</body>
</html>
