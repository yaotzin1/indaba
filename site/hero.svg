<svg class="hero-art" viewBox="0 0 640 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hero-t hero-d">
<title id="hero-t">How Indaba works</title>
<desc id="hero-d">Six agents sit in a circle around a fire, the engine. Messages pass between them while they debate; when they agree, lines run from each agent to the fire and the decision drops into a run below. The run moves through spec, plan and code to a gate. The first time the gate fails, the run retries code with only the last failure, then passes the gate, review, and finishes.</desc>
<defs>
  <radialGradient id="hero-glow" cx="50%" cy="50%" r="50%">
    <stop offset="0" class="h-glow-in"/>
    <stop offset="1" class="h-glow-out"/>
  </radialGradient>
  <linearGradient id="hero-flame" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0" stop-color="#c2410c"/>
    <stop offset=".6" stop-color="#f59e42"/>
    <stop offset="1" stop-color="#ffd977"/>
  </linearGradient>
</defs>
