<svg xmlns="http://www.w3.org/2000/svg" width="800" height="640" viewBox="0 0 800 640" role="img" aria-labelledby="t d">
<title id="t">Six ways to arrange agents in an Indaba workflow</title>
<desc id="d">Six small diagrams. In order: three steps with a gate before the last. At once: one planning step, two steps side by side, one joining step. Disagree: two roles exchanging messages with a judge below. Self-healing: a build step, a check, and an arrow from the check back to the build carrying the failure. A person decides: an agent step that hands a debate to a person. Oversight: one step above three, drawn dashed because it is specified and not built.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#65584a"/></marker>
<marker id="e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2410c"/></marker>
</defs>
<rect width="800" height="640" rx="10" fill="#f5efe4"/>
<g font-family="'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif" fill="#221c16">

<!-- 1 in order -->
<rect x="16" y="16" width="380" height="190" rx="8" fill="#fbf7f0" stroke="#bba98d"/>
<text x="32" y="44" font-size="17" font-weight="700">1  In order</text>
<text x="32" y="64" font-size="13" fill="#65584a">each step starts when the one before it is done</text>
<g stroke="#65584a" stroke-width="2" fill="none" marker-end="url(#a)">
<path d="M104 130H150"/><path d="M226 130H262"/><path d="M290 130H322"/>
</g>
<rect x="34" y="108" width="70" height="44" rx="8" fill="#e9cfa8" stroke="#94480f" stroke-width="2"/>
<text x="69" y="135" font-size="14" text-anchor="middle">plan</text>
<rect x="150" y="108" width="76" height="44" rx="8" fill="#e9cfa8" stroke="#94480f" stroke-width="2"/>
<text x="188" y="135" font-size="14" text-anchor="middle">build</text>
<path d="M276 108 304 130 276 152 248 130z" fill="#cfe5d6" stroke="#24694a" stroke-width="2"/>
<text x="276" y="135" font-size="12" text-anchor="middle">gate</text>
<rect x="322" y="108" width="62" height="44" rx="8" fill="#e9cfa8" stroke="#94480f" stroke-width="2"/>
<text x="353" y="135" font-size="14" text-anchor="middle">ship</text>
<text x="32" y="186" font-size="13" fill="#24694a">works today</text>

<!-- 2 at once -->
<rect x="404" y="16" width="380" height="190" rx="8" fill="#fbf7f0" stroke="#bba98d"/>
<text x="420" y="44" font-size="17" font-weight="700">2  At once, then joined</text>
<text x="420" y="64" font-size="13" fill="#65584a">independent steps, each in its own worktree</text>
<g stroke="#65584a" stroke-width="2" fill="none" marker-end="url(#a)">
<path d="M476 128C500 128 506 106 528 106"/><path d="M476 134C500 134 506 156 528 156"/>
<path d="M600 106C624 106 630 128 652 128"/><path d="M600 156C624 156 630 134 652 134"/>
</g>
<rect x="420" y="108" width="56" height="44" rx="8" fill="#e9cfa8" stroke="#94480f" stroke-width="2"/>
<text x="448" y="135" font-size="14" text-anchor="middle">plan</text>
<rect x="528" y="86" width="72" height="40" rx="8" fill="#e9cfa8" stroke="#94480f" stroke-width="2"/>
<text x="564" y="111" font-size="14" text-anchor="middle">part A</text>
<rect x="528" y="138" width="72" height="40" rx="8" fill="#e9cfa8" stroke="#94480f" stroke-width="2"/>
<text x="564" y="163" font-size="14" text-anchor="middle">part B</text>
<rect x="652" y="108" width="116" height="44" rx="8" fill="#cfe5d6" stroke="#24694a" stroke-width="2"/>
<text x="710" y="135" font-size="14" text-anchor="middle">join + check</text>
<text x="420" y="186" font-size="13" fill="#24694a">works today (parts written by hand)</text>

<!-- 3 disagree -->
<rect x="16" y="222" width="380" height="190" rx="8" fill="#fbf7f0" stroke="#bba98d"/>
<text x="32" y="250" font-size="17" font-weight="700">3  Disagree on purpose</text>
<text x="32" y="270" font-size="13" fill="#65584a">roles answer each other until they settle</text>
<g stroke="#c2410c" stroke-width="2" fill="none" marker-start="url(#e)" marker-end="url(#e)">
<path d="M116 330H252"/>
</g>
<circle cx="86" cy="330" r="30" fill="#e9cfa8" stroke="#94480f" stroke-width="2"/>
<text x="86" y="335" font-size="13" text-anchor="middle">role A</text>
<circle cx="282" cy="330" r="30" fill="#e9cfa8" stroke="#94480f" stroke-width="2"/>
<text x="282" y="335" font-size="13" text-anchor="middle">role B</text>
<text x="184" y="320" font-size="12" text-anchor="middle" fill="#c2410c">critique / agreement</text>
<path d="M184 336V372" stroke="#65584a" stroke-width="2" stroke-dasharray="4 4" fill="none" marker-end="url(#a)"/>
<rect x="136" y="374" width="96" height="26" rx="6" fill="#cfe5d6" stroke="#24694a" stroke-width="2"/>
<text x="184" y="392" font-size="12" text-anchor="middle">arbiter</text>
<text x="298" y="392" font-size="13" fill="#24694a">works today</text>

<!-- 4 try again -->
<rect x="404" y="222" width="380" height="190" rx="8" fill="#fbf7f0" stroke="#bba98d"/>
<text x="420" y="250" font-size="17" font-weight="700">4  Self-healing</text>
<text x="420" y="270" font-size="13" fill="#65584a">a failed check sends the failure back, a bounded number of times</text>
<g stroke="#65584a" stroke-width="2" fill="none" marker-end="url(#a)">
<path d="M504 336H576"/>
</g>
<path d="M650 360C650 392 540 392 540 362" stroke="#b3261e" stroke-width="2" fill="none" marker-end="url(#a)"/>
<text x="596" y="404" font-size="12" text-anchor="middle" fill="#b3261e">fails: once more, with the last failure only</text>
<rect x="434" y="314" width="70" height="44" rx="8" fill="#e9cfa8" stroke="#94480f" stroke-width="2"/>
<text x="469" y="341" font-size="14" text-anchor="middle">build</text>
<rect x="576" y="314" width="74" height="44" rx="8" fill="#cfe5d6" stroke="#24694a" stroke-width="2"/>
<text x="613" y="341" font-size="14" text-anchor="middle">check</text>
<path d="M650 336H700" stroke="#24694a" stroke-width="2" fill="none" marker-end="url(#a)"/>
<text x="728" y="341" font-size="13" text-anchor="middle" fill="#24694a">passes</text>
<text x="420" y="300" font-size="13" fill="#24694a">works today (a command is the check)</text>

<!-- 5 a person decides -->
<rect x="16" y="428" width="380" height="190" rx="8" fill="#fbf7f0" stroke="#bba98d"/>
<text x="32" y="456" font-size="17" font-weight="700">5  A person decides</text>
<text x="32" y="476" font-size="13" fill="#65584a">when the agents cannot settle, you rule</text>
<g stroke="#65584a" stroke-width="2" fill="none" marker-end="url(#a)">
<path d="M122 540H170"/><path d="M262 540H302"/>
</g>
<rect x="38" y="518" width="84" height="44" rx="8" fill="#e9cfa8" stroke="#94480f" stroke-width="2"/>
<text x="80" y="545" font-size="14" text-anchor="middle">debate</text>
<rect x="170" y="518" width="92" height="44" rx="22" fill="#cfe5d6" stroke="#24694a" stroke-width="2"/>
<text x="216" y="545" font-size="14" text-anchor="middle">you</text>
<text x="338" y="537" font-size="12" text-anchor="middle">accept</text>
<text x="338" y="553" font-size="12" text-anchor="middle">or reject</text>
<text x="32" y="598" font-size="13" fill="#24694a">works today in a terminal; answering from the page is specified</text>

<!-- 6 oversight (specified) -->
<rect x="404" y="428" width="380" height="190" rx="8" fill="#fbf7f0" stroke="#bba98d"/>
<text x="420" y="456" font-size="17" font-weight="700">6  Oversight</text>
<text x="420" y="476" font-size="13" fill="#65584a">a step that routes work and judges what comes back</text>
<g stroke="#65584a" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#a)">
<path d="M594 520C560 530 540 536 530 548"/><path d="M594 522V548"/><path d="M594 520C628 530 648 536 658 548"/>
</g>
<rect x="540" y="494" width="108" height="30" rx="8" fill="#fbf7f0" stroke="#94480f" stroke-width="2" stroke-dasharray="5 4"/>
<text x="594" y="514" font-size="14" text-anchor="middle">supervisor</text>
<rect x="470" y="550" width="70" height="30" rx="8" fill="#fbf7f0" stroke="#94480f" stroke-width="2" stroke-dasharray="5 4"/>
<text x="505" y="570" font-size="13" text-anchor="middle">worker</text>
<rect x="560" y="550" width="70" height="30" rx="8" fill="#fbf7f0" stroke="#94480f" stroke-width="2" stroke-dasharray="5 4"/>
<text x="595" y="570" font-size="13" text-anchor="middle">worker</text>
<rect x="650" y="550" width="70" height="30" rx="8" fill="#fbf7f0" stroke="#94480f" stroke-width="2" stroke-dasharray="5 4"/>
<text x="685" y="570" font-size="13" text-anchor="middle">worker</text>
<text x="420" y="598" font-size="13" fill="#94480f">specified, not built (dashed)</text>
</g>
</svg>
