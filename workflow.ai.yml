# ==============================================================================
# workflow.ai.yml - the AI *development* workflow for Indaba
#
# The single source for the rules every agent in this repository follows: Claude Code, Antigravity,
# Gemini and anything else. No agent toolchain loads this file by itself, so what it says reaches
# agents through generated files, and what it claims is checked by scripts:
#
#   AGENTS.md cycle block, GEMINI.md   generated by scripts/sync-agent-docs.mjs
#   .claude/skills/                    generated by scripts/sync-claude-skills.mjs
#   every claim below about the repo   checked by scripts/check-workflow.mjs
#
# THIS FILE IS NOT INDABA'S RUNTIME WORKFLOW FORMAT. Indaba is a product that executes
# `workflow.ai.yml` files written by its users (the contract is in docs/vision.md, section 4, and
# will be documented under docs/). This file, at the repository root, is the workflow the
# *developers and agents of Indaba* follow to change Indaba. It shares a file name and a family
# resemblance (stages, gates, roles) and nothing else: it has its own schema, parsed by
# scripts/lib/workflow-yaml.mjs, not by src/Workflow/Parser. Running this file's stages with Indaba
# itself (dogfooding) is a goal for later and an explicit non-goal today. Do not make the two
# schemas agree, and do not point the engine at this file.
#
# Everything here is one of two kinds, and the file does not blur them:
#
#   enforced   a hook, CI job, test or script fails when it is broken. `quality_gates`, `ci`,
#              `project`, `spec_kit`, the skill registry, and each rule's `enforced_by`.
#   guidance   what an agent is expected to do, with nothing that fails when it does not. `tracks`,
#              `stages` and `rules` whose `enforced_by` says "review". The procedure is in the file
#              each stage's `guidance` names.
#
# Do not add a setting that reads as configuration but that nothing reads. If a step matters enough
# to state as a setting, give it a check; otherwise write it as guidance.
#
# Edit this file, run the sync scripts, never the other way around.
# ==============================================================================

version: "2.0"
name: indaba
description: "Deterministic orchestration, debate and observability engine for multi-agent AI workflows, written in PHP 8.4+. A DAG of steps, a blackboard where agents cross-examine each other, unified runners, git-worktree isolation and OpenTelemetry GenAI traces."

# ------------------------------------------------------------------------------
# 0. Governance & Precedence
# ------------------------------------------------------------------------------
governance:
  authority: "This file is the supreme instruction source for every agent working in this repository. Where any other document disagrees with it, this file wins, and the other document is a defect to be fixed rather than a rule to be followed."
  precedence:
    - "workflow.ai.yml (this file) - supreme. Tracks, stages, the skill registry, quality gates and architectural rules are defined here and nowhere else."
    - ".agents/rules/** and .agents/skills/** - binding detail, procedures included (spec_driven_development, verification, branching, release, create_runner, create_guard). They elaborate this file and may not contradict it."
    - "AGENTS.md - loaded automatically by AGENTS.md-aware agents. Its cycle section is generated from this file; never hand-edit the generated block."
    - "GEMINI.md - generated, and it carries no rule of its own. Google documents no order between it and AGENTS.md, so neither may hold a rule the other lacks; it imports AGENTS.md and the order is then harmless."
    - "CLAUDE.md - Claude Code entry point. Imports AGENTS.md and may add tool-specific notes, never overrides."
    - "specs/<feature-name>/** - binding for one feature only, subordinate to everything above."
    - "docs/vision.md - the founding requirement, kept verbatim. Everything above outranks it where they differ."
  conflict_resolution: "Stop. Correct the subordinate document, re-run the sync scripts, then continue. Never settle a conflict by following the subordinate text."
  sync_commands:
    - "node scripts/sync-agent-docs.mjs"
    - "node scripts/sync-claude-skills.mjs"

# ------------------------------------------------------------------------------
# 1. Facts about the repository (enforced: scripts/check-workflow.mjs)
# ------------------------------------------------------------------------------
# Compared with composer.json and phpstan.neon on every commit, so a toolchain upgrade that forgets
# this file fails instead of leaving agents a stale description of the project.
project:
  architecture: "A framework-agnostic core and pure domain (src/Core, src/Workflow/Model, Graph and State, src/Mesh) with infrastructure around it: the engine and parser (src/Workflow), runners (src/Runners), git workspaces (src/Workspace), telemetry (src/Observability) and the Symfony Console front end (src/Console). The domain imports no Symfony class, enforced by an architecture test."
  distribution: "Composer package and CLI (bin/indaba), MIT licensed, semver. Packagist is webhook-driven: it reads the repository's tags, so a pushed v* tag is the release and that is the maintainer's call."
  development_environment: "PHP 8.4 runs only inside the Docker image in this repository (docker compose run --rm php composer ...). The host has no PHP; the Node scripts run on the host."
  workflow_distinction: "This file is the development workflow of Indaba, not the workflow format Indaba executes. See the header. Executing it with Indaba is a non-goal for now."
  runtime:
    php: ">=8.4"
  runtime_dependencies:
    - "psr/clock"
    - "psr/event-dispatcher"
    - "symfony/clock"
    - "symfony/console"
    - "symfony/event-dispatcher"
    - "symfony/http-client"
    - "symfony/process"
    - "symfony/yaml"
  symfony_constraint: "^7.2"
  toolchain:
    phpstan: 2
    phpunit: 11
    php_cs_fixer: 3
  phpstan_level: 9
  composer_scripts: [test, stan, cs, "cs:fix", qa]

# ------------------------------------------------------------------------------
# 2. Tracks: which stages a change goes through (guidance)
# ------------------------------------------------------------------------------
# Pick the track before starting. When the work turns out bigger than its track, move up to the
# larger track and do the stages it adds; never move down to skip them.
tracks:
  - id: feature
    when: "Anything a consumer would notice: a new or changed public class, method, interface, CLI command or option, workflow field, guard type, runner, default, emitted event or trace attribute, or a change to how a run behaves."
    stages: [specify, clarify, plan, tasks, analyze, implement, verify, review_ship]
    deliverables:
      - "a specs/<feature-name>/ directory satisfying spec_kit"
      - "CHANGELOG.md entry under Unreleased with the semver classification"
      - "docs/ and README.md updated where the surface appears"
  - id: fix
    when: "Restores behaviour that is already documented or specified. No new surface. A fix that has to change a public signature or a default is a feature."
    stages: [implement, verify, review_ship]
    deliverables:
      - "a test that fails before the fix and passes after it"
      - "CHANGELOG.md entry under Unreleased, in Fixed"
      - "if a public signature still changes, its classification in the owning spec's api-surface.md"
  - id: chore
    when: "Documentation, agent instructions, tests, CI, tooling or dev dependencies, with nothing a consumer installs changing."
    stages: [verify, review_ship]
    deliverables:
      - "CHANGELOG.md entry only when it reaches a consumer: the PHP floor, a runtime dependency, the files in the dist archive"
  - id: release
    when: "Cutting a version: moving Unreleased under a number and tagging."
    stages: [verify, review_ship]
    guidance: ".agents/skills/release/SKILL.md"
    deliverables:
      - "CHANGELOG.md section for the version, with its date and the compare links"
      - "a v<version> tag on the merge commit on main. Pushing it runs .github/workflows/release.yml, which creates the GitHub release, and Packagist picks the tag up by webhook: a pushed tag is a release decision, and it is the maintainer's"

# ------------------------------------------------------------------------------
# 2b. Agents (enforced: scripts/check-workflow.mjs reads `loads` and `max_chars`)
# ------------------------------------------------------------------------------
# Which agents read which files, and the largest file each will take. A file is held to the smallest
# limit among the agents that load it, because a file too long for one supported agent is broken
# for that agent. `max_chars: 0` means no limit is enforced, not that none exists. Every fact says
# how it was learned and when. These three entries were carried over from the sibling project
# apsw-gridwright and have not been re-verified for this repository.
agents:
  - id: antigravity
    loads: ["AGENTS.md", "GEMINI.md", ".agents/rules/*.md"]
    skills: ".agents/skills"
    max_chars: 12000
    source: "https://antigravity.google/docs/rules-workflows/ (the limit is per rules file; AGENTS.md counted as one, reported by a third party)"
    verified: "documented 2026-09-15, carried over from apsw-gridwright, not re-run here"
  - id: claude_code
    loads: ["CLAUDE.md", "AGENTS.md"]
    skills: ".claude/skills"
    max_chars: 0
    source: "CLAUDE.md imports AGENTS.md; skills are the generated pointers in .claude/skills"
    verified: "tested 2026-10-01 in apsw-gridwright, not re-run here"
  - id: gemini_cli
    loads: ["GEMINI.md"]
    skills: ""
    max_chars: 0
    source: "GEMINI.md imports AGENTS.md with @AGENTS.md; no size limit found"
    verified: "not tested"

# ------------------------------------------------------------------------------
# 3. Stages (guidance; procedure in .agents/skills/spec_driven_development/SKILL.md)
# ------------------------------------------------------------------------------
stages:
  - id: specify
    phase: 1
    name: "Specify"
    lead_skills: [architect, documentation, spec_driven_development]
    deliverables: ["specs/<feature-name>/spec.md"]
    guidance: ".agents/skills/spec_driven_development/SKILL.md"
    description: "The problem for the person who runs Indaba or embeds it, the stories, acceptance criteria, non-goals, and which module delivers it."

  - id: clarify
    phase: 2
    name: "Clarify"
    lead_skills: [architect, api_surface, documentation]
    deliverables: ["specs/<feature-name>/spec.md (clarifications)"]
    guidance: ".agents/skills/spec_driven_development/SKILL.md"
    description: "Resolves naming, defaults, failure behaviour and which side of the domain/infrastructure boundary a behaviour sits on. Every default chosen here is a decision a consumer inherits."

  - id: plan
    phase: 3
    name: "Plan"
    lead_skills: [architect, api_surface, workflow_engine, mesh_consensus, runner_adapter, workspace_git, observability, performance, documentation]
    deliverables:
      - "specs/<feature-name>/api-surface.md"
      - "specs/<feature-name>/plan.md, data-model.md, research.md, events.md where the feature has one (see spec_kit)"
    guidance: ".agents/skills/spec_driven_development/SKILL.md"
    description: "Designs the change, the state shape, and the exact public classes, signatures and semver classification. api-surface.md is the contract implementation is written against."

  - id: tasks
    phase: 4
    name: "Tasks"
    lead_skills: [architect, refactor, documentation]
    deliverables: ["specs/<feature-name>/tasks.md, where the work has more than one step worth tracking"]
    guidance: ".agents/skills/spec_driven_development/SKILL.md"
    description: "An ordered checklist of testable tasks: domain first, infrastructure second, console and documentation last."

  - id: analyze
    phase: 5
    name: "Analyze"
    lead_skills: [api_surface, application_security, security_guard, static_analysis, performance]
    deliverables: []
    guidance: ".agents/skills/spec_driven_development/SKILL.md"
    description: "Audits the plan before code: breaking changes without a major, a framework class in the domain, a new runtime dependency, untrusted data reaching a shell, a path or a log, a wall clock in decision logic, an unbounded loop. A failure returns to Plan."

  - id: implement
    phase: 6
    name: "Implement"
    lead_skills: [architect, workflow_engine, mesh_consensus, runner_adapter, workspace_git, observability, application_security]
    deliverables: []
    guidance: ".agents/rules/agent_orchestration.md"
    description: "Writes the change against api-surface.md, tests first. It may be split between a domain agent and an infrastructure agent when the contract is precise enough; an agent that finds the contract wrong stops and reports rather than editing it."

  - id: verify
    phase: 7
    name: "Verify"
    lead_skills: [qa, smoke_tests, static_analysis, verification, debugger]
    deliverables: []
    guidance: ".agents/skills/verification/SKILL.md"
    description: "Runs docker compose run --rm php composer qa and the node gates end to end and reports their actual output. A failing gate is investigated from its own output; after three failed attempts the plan is wrong, not the code."

  - id: review_ship
    phase: 8
    name: "Review and ship"
    lead_skills: [documentation, release, application_security, security_guard, api_surface]
    deliverables:
      - "specs/<feature-name>/review.md (feature track), or the review answers in the pull request"
      - "AGENTS.md, README.md, CHANGELOG.md, specs/DEPENDENCY_MAP.md and docs/ where they changed"
    guidance: ".agents/rules/review.md"
    description: "The 7-dimension self-review, documentation synchronised with the change, and a pull request whose required CI checks are green before it merges."

# ------------------------------------------------------------------------------
# 3b. Track enforcement (enforced: .githooks/commit-msg and the CI job "Track and deliverables")
# ------------------------------------------------------------------------------
# The tracks above are guidance; this is the part of them a script can check. Every commit carries a
# `Track:` trailer, and scripts/check-track.mjs holds the diff to it: a chore touches no source, a
# release touches only the changelog and composer.json, a fix that changes source also changes a
# test and a changelog, a feature carries a complete spec directory and a changelog entry. A pull
# request is held to the heaviest track any of its commits declares. A commit that touches the files
# that define or enforce the workflow also carries `Workflow-Change: <why>`, so weakening a check is
# visible in the history. What it cannot do is judge a stage, or stop `--no-verify`: CI re-runs it on
# the pull request, and the required check on main is the wall.
enforcement:
  # Commits this one contains predate the check and are not held to it. "none" until the first
  # commit exists; replace it with that commit's full hash when the check should start there.
  baseline: "351d960a925e97f43de08c0f2ca10ba9d2108679"
  tracks: [feature, fix, chore, release]
  source_paths: ["src/", "bin/"]
  test_paths: ["tests/"]
  changelogs: ["CHANGELOG.md"]
  release_paths: ["CHANGELOG.md", "composer.json"]
  protected_paths: ["workflow.ai.yml", "scripts/check-*", "scripts/sync-*", "scripts/validate-skills.mjs", "scripts/security-audit.mjs", "scripts/install-hooks.mjs", "scripts/lib/", ".githooks/", ".github/workflows/", ".claude/settings*.json", "phpstan.neon", ".php-cs-fixer.dist.php", "phpunit.xml.dist", "tests/Unit/Architecture/"]

# ------------------------------------------------------------------------------
# 4. Spec directories (enforced: scripts/check-workflow.mjs)
# ------------------------------------------------------------------------------
# A small feature does not have a lifecycle contract or a data model, and making it write one
# produces padding. Every feature writes the required files. An optional file is either present or
# named under the omission heading in spec.md with the reason it does not apply.
spec_kit:
  directory: "specs"
  template: "specs/_template"
  required: [spec.md, api-surface.md, review.md]
  optional: [plan.md, tasks.md, data-model.md, research.md, events.md]
  omission_heading: "## Artifacts not written"

# ------------------------------------------------------------------------------
# 5. Skills (enforced: the registry must match .agents/skills/)
# ------------------------------------------------------------------------------
skills:
  directory: ".agents/skills"
  validator: "scripts/validate-skills.mjs"
  # Canonical text lives in .agents/skills. Claude Code discovers skills only under .claude/skills,
  # so scripts/sync-claude-skills.mjs mirrors each one there as a pointer (underscores become
  # hyphens). Pointers, never copies: one text, two toolchains.
  claude_code_mirror:
    directory: ".claude/skills"
    generator: "scripts/sync-claude-skills.mjs"
    check: "node scripts/sync-claude-skills.mjs --check"
  registry:
    # Architecture & public contract
    - name: architect
      role: "Architecture & Boundary Steward"
      path: ".agents/skills/architect/SKILL.md"
      scope: "The pure domain versus infrastructure boundary, layering, dependency direction, deciding which module a behaviour belongs in"
    - name: api_surface
      role: "Public API & Semver Steward"
      path: ".agents/skills/api_surface/SKILL.md"
      scope: "Public classes and interfaces, final and readonly decisions, breaking-change classification, workflow file schema and CLI as public contract, Packagist tags"

    # Domain modules
    - name: workflow_engine
      role: "Workflow Engine Specialist"
      path: ".agents/skills/workflow_engine/SKILL.md"
      scope: "The workflow parser and validation, DAG ordering, the step state machine, guards, on_failure and retry-loop isolation, determinism"
    - name: mesh_consensus
      role: "Agent Mesh & Consensus Specialist"
      path: ".agents/skills/mesh_consensus/SKILL.md"
      scope: "AgentMessage envelopes, the blackboard, turn-taking, quorum and the consensus arbiter, ping-pong detection"
    - name: runner_adapter
      role: "Runner Adapter Specialist"
      path: ".agents/skills/runner_adapter/SKILL.md"
      scope: "RunnerInterface, RunRequest and RunResult, PTY CLI runners, the OpenRouter SSE runner, ShellRunner, cancellation, timeouts and the registry"
    - name: create_runner
      role: "Runner Author's Guide"
      path: ".agents/skills/create_runner/SKILL.md"
      scope: "Writing a new runner end to end: the contract, process or HTTP handling, streaming, usage reporting, registration, tests and documentation"
    - name: extensibility
      role: "Extension Point Steward"
      path: ".agents/skills/extensibility/SKILL.md"
      scope: "The contracts third parties extend (runners, guards, PSR-14 listeners, pricing, exporters), the no-privileged-access rule, extensions failing alone"
    - name: create_guard
      role: "Guard Author's Guide"
      path: ".agents/skills/create_guard/SKILL.md"
      scope: "Adding a workflow guard type end to end: the verdict contract, schema, path confinement, tests and documentation"
    - name: workspace_git
      role: "Git Workspace Specialist"
      path: ".agents/skills/workspace_git/SKILL.md"
      scope: "Worktree-per-task isolation, the Git wrapper, diff generation and git apply, deterministic teardown, branch and path safety"
    - name: observability
      role: "Observability & Telemetry Specialist"
      path: ".agents/skills/observability/SKILL.md"
      scope: "Trace, span and child-span structure, OpenTelemetry GenAI attribute names, token and cost accounting, the pricing table, PSR-14 events and streaming"

    # Quality
    - name: qa
      role: "PHPUnit Test Specialist"
      path: ".agents/skills/qa/SKILL.md"
      scope: "PHPUnit 11, contract-first tests, fakes for runners and the clock, deterministic engine tests, git fixtures, what to assert"
    - name: static_analysis
      role: "Static Analysis Specialist"
      path: ".agents/skills/static_analysis/SKILL.md"
      scope: "PHPStan level 9 with no ignoreErrors, PHP-CS-Fixer PER-CS2.0, typing arrays and generics honestly, strict_types"
    - name: application_security
      role: "Application Security Guardian"
      path: ".agents/skills/application_security/SKILL.md"
      scope: "Command injection, path traversal for artifacts and guards, secret handling and redaction, SSRF and HTTP, unserialize and YAML, prompt-injected data reaching a shell. Banned constructs, no exceptions"
    - name: security_guard
      role: "Supply Chain & Publish Safety Specialist"
      path: ".agents/skills/security_guard/SKILL.md"
      scope: "Runtime dependency policy, composer audit, Composer plugins and scripts, the lockfile, what the dist archive contains, CI and release secrets"
    - name: smoke_tests
      role: "Built-Artifact Verification Specialist"
      path: ".agents/skills/smoke_tests/SKILL.md"
      scope: "The production install smoke test (git archive, composer install --no-dev, the CLI boots) and the export-ignore archive audit"
    - name: performance
      role: "Performance & Resource Specialist"
      path: ".agents/skills/performance/SKILL.md"
      scope: "Streaming without buffering whole outputs, process and worktree lifetime, trace volume, measuring before changing"
    - name: debugger
      role: "Systematic Debugging Specialist"
      path: ".agents/skills/debugger/SKILL.md"
      scope: "Reading the actual failure output, running one gate alone in Docker, isolating engine from runner, reproducing a report as a test first"

    # Craft & delivery
    - name: refactor
      role: "Refactoring & Technical Debt Specialist"
      path: ".agents/skills/refactor/SKILL.md"
      scope: "Behaviour-preserving change, splitting an overgrown class, deprecating a public symbol without breaking it"
    - name: documentation
      role: "Spec & Documentation Architect"
      path: ".agents/skills/documentation/SKILL.md"
      scope: "Spec directories and which artifacts a feature needs, README, CHANGELOG, DEPENDENCY_MAP, docs/, docblocks that explain why"
    - name: release
      role: "Release & Packagist Specialist"
      path: ".agents/skills/release/SKILL.md"
      scope: "Version selection, CHANGELOG entries, tags, the GitHub release workflow, what Packagist reads from a tag"
    - name: spec_driven_development
      role: "Change Process Steward"
      path: ".agents/skills/spec_driven_development/SKILL.md"
      scope: "Choosing the track and running a change through specify, clarify, plan, tasks, analyze, implement, verify and ship"
    - name: verification
      role: "Verification Steward"
      path: ".agents/skills/verification/SKILL.md"
      scope: "composer qa in Docker, the node gates, reading a failing gate from its own output, and the manual checks no gate can make"
    - name: branching
      role: "Branch & Merge Steward"
      path: ".agents/skills/branching/SKILL.md"
      scope: "Branch names, conventional commits and track trailers, squash merging, and what protects main"

# ------------------------------------------------------------------------------
# 6. Gates (enforced)
# ------------------------------------------------------------------------------
quality_gates:
  # `.git/hooks` is not versioned, so the hook lives in `.githooks/` and `core.hooksPath` points at
  # it. check-workflow.mjs fails when a gate listed here is missing from the hook or from CI.
  # The document gates are pure Node and always run. The PHP gate runs through Docker because the
  # host has no PHP 8.4; when Docker is unreachable the hook says so loudly and skips it, and CI is
  # the wall.
  local_hook:
    path: ".githooks/pre-commit"
    commit_msg_path: ".githooks/commit-msg"
    install: "node scripts/install-hooks.mjs"
  pre_commit:
    - name: "Skills Syntax & Security Validation"
      command: "node scripts/validate-skills.mjs"
    - name: "Claude Code Skill Pointer Sync"
      command: "node scripts/sync-claude-skills.mjs --check"
    - name: "Operating Cycle Mirrored Into AGENTS.md"
      command: "node scripts/sync-agent-docs.mjs --check"
    - name: "Workflow Claims Match the Repository"
      command: "node scripts/check-workflow.mjs"
    - name: "Security Audit (banned constructs, secrets, phpstan.neon, composer.json)"
      command: "node scripts/security-audit.mjs --source"
    - name: "Script Self-Tests"
      command: "node --test scripts/*.test.mjs"
    - name: "PHP Quality Gate (PHP-CS-Fixer, PHPStan level 9, PHPUnit)"
      command: "composer qa"
  # Runs from the commit-msg hook, where the message exists, and in CI over every commit in a pull
  # request. Same script, same rules.
  commit_msg:
    - name: "Commit Declares Its Track and Matches It"
      command: "node scripts/check-track.mjs"

# The checks a pull request needs before it can merge into main. check-workflow.mjs compares this
# list with the job names in the CI file on every commit. Branch protection lives in GitHub, where
# a commit cannot see it: `node scripts/check-workflow.mjs --remote` compares it too, and the
# release procedure requires running that before tagging.
ci:
  workflow: ".github/workflows/ci.yml"
  protected_branch: main
  required_checks:
    - "Agent instruction set"
    - "Track and deliverables"
    - "Dependency audit"
    - "Verify on PHP 8.4"
    - "Verify on PHP 8.5"

# ------------------------------------------------------------------------------
# 7. Architectural rules
# ------------------------------------------------------------------------------
# `enforced_by` names what fails when the rule is broken, or says "review" when nothing does. File
# paths in it are checked to exist. A rule whose enforcement is "review" is exactly as strong as the
# review, so the pull request template asks about each one.
architectural_rules:
  - rule: "The core is framework-agnostic. Nothing under src/Core, src/Workflow/Model, src/Workflow/Graph, src/Workflow/State or src/Mesh may import or name a Symfony class, and those directories import upward into nothing but themselves and src/Core. Symfony lives at the edges: the parser (Yaml), the runners (Process, HttpClient), the console, the event dispatcher bridge. A change that needs an exception belongs in infrastructure, behind an interface the domain owns."
    enforced_by: "`tests/Unit/Architecture/BoundaryTest.php` (token scan of the pure directories), reviewed under dimension 1"
  - rule: "PHPStan runs at level 9 with zero errors and no ignoreErrors: not in phpstan.neon, not as a baseline file, not as an inline @phpstan-ignore comment. A type the analyser cannot follow is fixed in the code, with a precise docblock, a value object or an assertion at the boundary, never silenced."
    enforced_by: "`scripts/security-audit.mjs` (phpstan.neon and inline ignores), `scripts/check-workflow.mjs` (the level), and CI (Verify on PHP 8.4 and 8.5)"
  - rule: "The engine is deterministic. Given the same workflow, the same runner outputs and the same injected clock and id source, a run takes the same steps in the same order and ends in the same state. Decision logic under src/Core, src/Workflow and src/Mesh reads no wall clock, no randomness and no environment: time arrives as a Psr Clock, ids as an injected generator, configuration as constructor arguments. DAG ordering breaks ties by declaration order, never by hash order."
    enforced_by: "`scripts/security-audit.mjs` (determinism rules for those directories); tie-breaking and replay by review (.agents/rules/review.md, dimension 2)"
  - rule: "Retry-loop isolation. When a step fails and on_failure retries a target, the next prompt receives only the isolated failure of the last attempt (the stderr or the failing assertion), never the accumulated error history. The retry count is bounded by max_retries, and a bounded exhaustion ends in the declared escalation, not another loop."
    enforced_by: "review (.agents/rules/review.md, dimension 2); the engine's retry tests under tests/Unit/Workflow are the evidence a review asks for"
  - rule: "One runner contract. Every way of running an agent or a command implements RunnerInterface and returns a RunResult; the engine, the mesh and the console depend on the interface and the registry, never on a concrete runner. A runner owns its process or connection, honours the timeout and cancellation in its RunRequest, reports token usage when it knows it, and never leaks a child process."
    enforced_by: "`tests/Unit/Architecture/BoundaryTest.php` (only the registry's composition code may name a concrete runner); the contract itself by review (dimension 2)"
  - rule: "Secrets are never logged. API keys and tokens reach a runner through the environment of its own process or its own Authorization header and nowhere else: not in a trace attribute, an event, an exception message, a result artifact, a prompt or a log line. Every outgoing representation of a request redacts them."
    enforced_by: "`scripts/security-audit.mjs` (credential shapes in source, committed .env files, a heuristic for logging a credential); redaction behaviour by review (dimension 4)"
  - rule: "No shell string interpolation of untrusted data. Processes are started with an argument array through Symfony Process. The only code that may hand a string to a shell is the runner for commands the workflow author declared (ShellRunner), and nothing derived from a model's output, a file name, a branch name or an artifact path is concatenated into a command line. eval, the shell functions, the backtick operator, unserialize of untrusted data and the @ operator are banned everywhere."
    enforced_by: "`scripts/security-audit.mjs` (banned constructs, the fromShellCommandline allowlist); the data flow into ShellRunner by review (dimension 4)"
  - rule: "Paths are confined. A path taken from a workflow file, a model, a guard or an artifact name is resolved against its root and rejected if it leaves it, before it is read, written, diffed or handed to git. Worktrees live under .indaba/worktrees/<taskId> and nowhere else, and teardown removes only what the manager created."
    enforced_by: "review (.agents/rules/review.md, dimension 4); the confinement tests named in the owning spec"
  - rule: "Observability follows the OpenTelemetry GenAI semantic conventions. A task is a trace, a workflow step a span, an LLM call, a tool execution or a shell verification a child span, with gen_ai.* attribute names for the system, the model and the input and output token counts, and cost as a separate, documented attribute. The conventions are still developing; the attribute set in use is recorded in the observability spec, and a rename follows the convention, not taste."
    enforced_by: "review (.agents/rules/review.md, dimension 5); the span and attribute tests of the observability feature"
  - rule: "Every feature has a specs/<feature-name>/ directory containing spec.md, api-surface.md and review.md. Each of plan.md, tasks.md, data-model.md, research.md and events.md is either written or named in spec.md under Artifacts not written, with the reason it does not apply."
    enforced_by: "`scripts/check-workflow.mjs`; the track check holds a feature commit to it (`scripts/check-track.mjs`)"
  - rule: "Runtime dependencies are a recorded decision. composer.json require lists exactly the packages project.runtime_dependencies names, every Symfony component on one constraint, and composer audit is clean. A new entry requires the decision in the feature's spec, because every one is a version Indaba can force onto a consumer's tree."
    enforced_by: "`scripts/check-workflow.mjs` (the list and the Symfony constraint) and CI (Dependency audit)"
  - rule: "Public API changes are classified before they are written. Adding a class, an optional constructor argument with a default or a method is a minor; changing a signature, a default, an enum case, the workflow file schema, a CLI option or an emitted event or span attribute is a major. Record the classification in the spec and in CHANGELOG.md. Below 1.0 a major takes the next minor and says so."
    enforced_by: "review (.agents/rules/review.md, dimension 3)"
  - rule: "PHP runs in Docker. The host has no PHP 8.4, and a result from any other interpreter is not evidence. Every PHP command in this repository, in a hook, in documentation and in a report, is docker compose run --rm php composer <script> or the equivalent vendor/bin call inside it."
    enforced_by: "review; the pre-commit hook and CI both run composer qa, so a change that only works on another PHP fails in CI"
  - rule: "Repository documentation moves with the change: AGENTS.md, README.md, CHANGELOG.md and specs/DEPENDENCY_MAP.md whenever the public surface, the architecture or the release contents change, and the files under docs/ in the same change as any added, removed or changed workflow field, guard, runner option, CLI option or default."
    enforced_by: "review (.github/PULL_REQUEST_TEMPLATE.md)"
  - rule: "No invented numbers. A token count, a cost or a duration that Indaba reports was measured or received from the provider, or is labelled an estimate with its source (the pricing table's date). A cost is never silently zero because a model is missing from the table: unknown is reported as unknown."
    enforced_by: "review (.agents/rules/review.md, dimension 5)"
